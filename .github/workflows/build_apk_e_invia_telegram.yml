name: "Build APK Android e Invio su Telegram — Immobiliare Giancani"

on:
  workflow_dispatch:

jobs:
  build-and-send-apk:
    name: "Compila APK Debug e Invia su Telegram"
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "2. Configura Java JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "3. Configura Android SDK"
        uses: android-actions/setup-android@v3

      - name: "4. Compila APK Android (assembleDebug)"
        working-directory: android_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: "5. Invia APK compilato su Telegram"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8671578336:AAEHI-s-2g3dY9qnIIVc_hWzDdOuHm-MS6M' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1723292483' }}
        run: |
          APK_PATH=$(find android_app/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK trovato: $APK_PATH"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=📱 App Android Immobiliare Giancani aggiornata con la nuova sezione Annunci Pubblicati (Feed XML Live)! — Immobiliare Giancani"
