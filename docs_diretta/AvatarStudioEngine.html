    if (q.includes('dar') && q.includes('ia')) return chars.daria;

    if (q.includes('bea') || q.includes('elen') || q.includes('helen')) return chars.beatrice;
    if (q.includes('tin') || q.includes('giul') || q.includes('jul')) return chars.tina;
    if (q.includes('chiar') || q.includes('sof') || q.includes('soph')) return chars.chiara;
    if (q.includes('wal') || q.includes('marc') || q.includes('mark')) return chars.walter;
    if (q.includes('ugo') || q.includes('aless') || q.includes('alex')) return chars.ugo;
    if (q.includes('leo')) return chars.leo;

    return chars.dario;
  }

  function getCharacterImage(charObj) {
    if (!charObj) return '';
    if (window.AVATAR_ROSTER) {
      var all = (window.AVATAR_ROSTER.donne || []).concat(window.AVATAR_ROSTER.uomini || []);
      var match = all.find(function(a){ return a.id === charObj.assetRef || a.id === charObj.id; });
      if (match && match.img) return match.img;
    }
    return '';
  }

  // 1. REGOLE LAYOUT: BOX DESTRO SWAP RAPIDO FADE CROSS (300ms)
  function applicaOspiteDestro(charObj, onComplete) {
    if (!charObj) charObj = window.AVATAR_STUDIO_CONFIG.characters.dario;
    // GUARDIA ASSOLUTA: Daria e la conduttrice fissa del Box Sinistro e non deve MAI apparire nel Box Destro!
    if (charObj.id === 'daria') {
      if (onComplete) onComplete();
      return;
    }
    if (_currentRightSpeaker === charObj.id) {
      if (onComplete) onComplete();
      return;
    }

    _currentRightSpeaker = charObj.id;
    var unitDestro = document.getElementById('unit-dario');
    var boxDestro = document.getElementById('box-destro-ospiti');
    var elBaseO = document.getElementById('p-or-base');
    var elSpkO = document.getElementById('p-or-spk');
    var elBlinkO = document.getElementById('p-or-blink');
    var elArmsO = document.getElementById('p-or-arms');
    var lipO = document.getElementById('lip-rig-dario');
    var micSpanO = document.querySelector('#mic-dario span');

    if (!unitDestro) {
      if (onComplete) onComplete();
      return;
    }

    // Inizia dissolvenza in uscita (150ms)
    unitDestro.classList.add('fade-cross-swap', 'fading-out');

    setTimeout(function() {
      var isDario = (charObj.id === 'dario');
      var imgSrc = getCharacterImage(charObj);

      if (boxDestro) {
        if (charObj.needsMirror) {
          boxDestro.classList.add('mirrored-host');
        } else {
          boxDestro.classList.remove('mirrored-host');
        }
      }

      if (!isDario && imgSrc) {
        if (elBaseO) {
          elBaseO.src = imgSrc;
          elBaseO.classList.add('photo-avatar');
        }
        if (elSpkO) {
          elSpkO.src = (charObj.spk) ? charObj.spk : ("data:image/png;base64," + B64_IMAGES.or_spk);
          elSpkO.style.display = '';
          elSpkO.classList.add('photo-avatar');
        }
        if (elBlinkO) {
          if (charObj.id === 'antonio' || charObj.assetRef === 'antonio_giancani') {
            elBlinkO.src = 'assets/antonio_giancani_blink.png';
            elBlinkO.style.display = '';
          } else {
            elBlinkO.style.display = 'none';
          }
        }
        if (elArmsO) elArmsO.style.display = 'none';
        if (lipO) {
          lipO.style.display = 'none';
          lipO.style.opacity = '0';
        }
      } else {
        if (elBaseO) {
          elBaseO.src = (typeof B64_IMAGES !== 'undefined' && B64_IMAGES.or_base) ? "data:image/png;base64," + B64_IMAGES.or_base : imgSrc;
          elBaseO.classList.remove('photo-avatar');
        }
        if (elSpkO) elSpkO.style.display = '';
        if (elBlinkO) elBlinkO.style.display = '';
        if (elArmsO) elArmsO.style.display = '';
      }

      // Ricalibrazione anatomica del centramento facciale e coordinate del lip-rig
      if (lipO && charObj.mouthX && charObj.mouthY) {
        var effMouthX = charObj.needsMirror ? (100 - charObj.mouthX) : charObj.mouthX;
        lipO.style.left = effMouthX + '%';
        lipO.style.top = charObj.mouthY + '%';
        if (charObj.mouthW) lipO.style.width = charObj.mouthW + 'px';
        if (charObj.mouthH) lipO.style.height = charObj.mouthH + 'px';
      }

      if (micSpanO) {
        micSpanO.innerHTML = charObj.nome + ' &bull; ' + charObj.ruolo.split('(')[0].trim();
      }

      // Dissolvenza in entrata (150ms) -> Totale Cross-Fade esatto: 300ms
      unitDestro.classList.remove('fading-out');
      unitDestro.classList.add('fading-in');

      setTimeout(function() {
        unitDestro.classList.remove('fading-in', 'fade-cross-swap');
        if (onComplete) onComplete();
      }, 150);

    }, 150);
  }

  // Ritorno automatico a Dario (rispetta la modalità conduttore unico se attiva)
  function ripristinaDarioDestro(onComplete) {
    var boxDestro = document.getElementById('box-destro-ospiti');
    if (window._currentConductorMode === 'solo_antonio' || window._currentConductorMode === 'solo_daria') {
      if (boxDestro) boxDestro.style.setProperty('display', 'none', 'important');
      if (onComplete) onComplete();
      return;
    }

    var elBaseO = document.getElementById('p-or-base');
    var elSpkO = document.getElementById('p-or-spk');
    var elBlinkO = document.getElementById('p-or-blink');
    var elArmsO = document.getElementById('p-or-arms');
    var lipO = document.getElementById('lip-rig-dario');
    var micSpanO = document.querySelector('#mic-dario span');
    var boxDestro = document.getElementById('box-destro-ospiti');

    if (boxDestro) boxDestro.classList.remove('mirrored-host');
    if (elBaseO) {
      if (typeof B64_IMAGES !== 'undefined' && B64_IMAGES.or_base) {
        elBaseO.src = "data:image/png;base64," + B64_IMAGES.or_base;
      }
      elBaseO.classList.remove('photo-avatar');
    }
    if (elSpkO) elSpkO.style.display = '';
    if (elBlinkO) elBlinkO.style.display = '';
    if (elArmsO) elArmsO.style.display = 'none';
    if (lipO) {
      lipO.style.display = 'none';
      lipO.style.opacity = '0';
    }
    if (micSpanO) micSpanO.innerHTML = 'DARIO &bull; Desk Digitale';
    if (onComplete) onComplete();
  }

  // 2. LOGICA SCHERMO CENTRALE: IDLE (LOGO AGENZIA) vs ATTIVO (MEDIA + SCHEDA TECNICA)
  function impostaSchermoCentrale(mediaUrl, schedaInfo) {
    var screenIdle = document.getElementById('screen-state-idle');
    var screenActive = document.getElementById('screen-state-active');
    var imgEl = document.getElementById('screen-media-img');
    var vidEl = document.getElementById('screen-media-video');
    var roomNameEl = document.getElementById('tech-room-name');
    var mqEl = document.getElementById('tech-badge-mq');
    var energyEl = document.getElementById('tech-badge-energy');
    var priceEl = document.getElementById('tech-badge-price');

    if (!screenIdle || !screenActive) return;

    if (!mediaUrl && !schedaInfo) {
      // STATO IDLE / DEFAULT: Mostra Logo Ufficiale Immobiliare Giancani con loop animato
      screenActive.style.opacity = '0';
      setTimeout(function() {
        screenActive.style.display = 'none';
        screenIdle.style.display = 'flex';
        screenIdle.style.opacity = '1';
      }, 300);
      _activeMediaUrl = null;
      if (window.CentralScreenSpotManager) {
        window.CentralScreenSpotManager.riprendiRotazioneSpot();
      }
      return;
    }

    // STATO DINAMICO ATTIVO: Foto/Clip + Scheda Tecnica Sovraimpressa
    if (window.CentralScreenSpotManager) {
      window.CentralScreenSpotManager.pausaPerDescrizioneStanza();
    }
    var isVideo = mediaUrl && (mediaUrl.endsWith('.mp4') || mediaUrl.includes('video'));
    if (imgEl && vidEl) {
      if (isVideo) {
        imgEl.style.display = 'none';
        vidEl.style.display = 'block';
        vidEl.src = mediaUrl;
        vidEl.play().catch(function(){});
      } else if (mediaUrl) {
        vidEl.style.display = 'none';
        imgEl.style.display = 'block';
        imgEl.src = mediaUrl;
      }
    }

    if (schedaInfo) {
      if (roomNameEl && schedaInfo.stanza) roomNameEl.textContent = schedaInfo.stanza.toUpperCase();
      if (mqEl) {
        var rawMq = schedaInfo.mq ? String(schedaInfo.mq).replace(/\bmetri\s*quadri\b/gi, '').replace(/\b(?:mq|m²|m2)\b/gi, '').trim() : '120';
        mqEl.textContent = rawMq + ' metri quadri'; // Regola: Metri Quadri esteso
      }
      if (energyEl && schedaInfo.classeEnergetica) energyEl.textContent = 'Classe ' + schedaInfo.classeEnergetica;
      if (priceEl && schedaInfo.prezzo) priceEl.textContent = String(schedaInfo.prezzo);
    }

    screenIdle.style.opacity = '0';
    setTimeout(function() {
      screenIdle.style.display = 'none';
      screenActive.style.display = 'flex';
      screenActive.style.opacity = '1';
    }, 200);

    _activeMediaUrl = mediaUrl;
  }

  // 3. SOTTOTITOLI DINAMICI E PERSONALIZZAZIONE COLORI (TOP BAR)
  function renderizzaSottotitolo(charObj, text) {
    if (!charObj) charObj = window.AVATAR_STUDIO_CONFIG.characters.daria;
    var badge = document.getElementById('sub-speaker-badge');
    var stream = document.getElementById('sub-text-stream');

    if (badge) {
      badge.textContent = charObj.label;
      badge.style.background = charObj.colore;
      badge.style.color = charObj.coloreBadgeText || '#000';
    }
    if (stream) {
      stream.textContent = text || '';
      stream.style.color = charObj.colore;
    }
  }

  // 4. TRIGGER E TRANSIZIONE SCENA UNIFICATA
  // Input evento: { speaker: "NOME", text: "...", media_url: "...", duration: SECONDI, scheda: {...} }
  function eseguiTriggerScena(evento, onFinish) {
    if (!evento) return;
    var charObj = resolveCharacter(evento.speaker);
    var isDaria = (charObj.id === 'daria');
    var isGuest = (!isDaria && charObj.id !== 'dario');

    // 1. DarIO resta SEMPRE il co-conduttore fisso dello studio (NESSUNA sovrapposizione con foto avatar)
    // Se parla un ospite o Dario, il desk destro rimane DarIO animato e dinamico
    ripristinaDarioDestro();

    // 2. Aggiorna lo schermo centrale
    if (evento.media_url || evento.scheda || evento.isDescription) {
      impostaSchermoCentrale(evento.media_url, evento.scheda);
    } else {
      impostaSchermoCentrale(null, null); // Torna a stato Idle Logo
    }

    // 3. Stampa il testo nella top bar con il codice colore corrispondente
    renderizzaSottotitolo(charObj, evento.text);

    // Gestione visuale speaking
    var unitD = document.getElementById('unit-daria');
    var unitO = document.getElementById('unit-dario');
    if (isDaria) {
      if (unitD) unitD.classList.add('speaking');
      if (unitO) unitO.classList.remove('speaking');
    } else {
      if (unitO) unitO.classList.add('speaking');
      if (unitD) unitD.classList.remove('speaking');
    }

    // Regia Broadcast: Close-up dinamico per tutti i conduttori (DarIA, DarIO, Ospiti)
    var mgr = window.AvatarCloseUpManager || window.DariaCloseUpManager;
    if (mgr) {
      mgr.attivaSeArmato(charObj ? charObj.id : (isDaria ? 'daria' : 'dario'), evento.text);
    }

    // Callback di fine traccia
    var handleEnd = function() {
      if (unitD) unitD.classList.remove('speaking');
      if (unitO) unitO.classList.remove('speaking');

      var mgrEnd = window.AvatarCloseUpManager || window.DariaCloseUpManager;
      if (mgrEnd && mgrEnd.isAttivo()) {
        mgrEnd.disattivaPrimoPiano();
      }

      // 5. A fine traccia, se era un ospite e lo step successivo non è un altro ospite, reimposta Dario a destra
      if (isGuest) {
        ripristinaDarioDestro();
      }

      if (onFinish) onFinish();
    };

    return {
      character: charObj,
      handleEnd: handleEnd
    };
  }

  return {
    resolveCharacter: resolveCharacter,
    applicaOspiteDestro: applicaOspiteDestro,
    ripristinaDarioDestro: ripristinaDarioDestro,
    impostaSchermoCentrale: impostaSchermoCentrale,
    renderizzaSottotitolo: renderizzaSottotitolo,
    eseguiTriggerScena: eseguiTriggerScena
  };
})();

/* ═══════════════════════════════════════════════════════════════════════
   🎬 REGIA BROADCAST: CONTROLLER CLOSE-UP DINAMICO MULTI-AVATAR
   Cadenza variabile dinamica (45s - 85s) per DarIA, DarIO e tutti gli Ospiti
   Ingrandimento elegante (1.36x) sul conduttore in onda con ritorno fluido
   Personal Branding: Immobiliare Giancani
   ═══════════════════════════════════════════════════════════════════════ */
window.AvatarCloseUpManager = (function() {
  var _isArmed = false;
  var _isActive = false;
  var _timer = null;
  var _safetyTimeout = null;
  var _lastTriggerTime = Date.now();
  var _currentActiveSide = null;

  // Cadenza dinamica: ogni 45-85 secondi
  function _calcolaProssimoIntervallo() {
    return Math.floor(Math.random() * (85000 - 45000 + 1)) + 45000;
  }

  function pianificaProssimoPrimoPiano() {
    if (_timer) clearTimeout(_timer);
    var delay = _calcolaProssimoIntervallo();
    console.log('[REGIA-AVATAR] 🎬 Prossimo Primo Piano programmato tra ' + Math.round(delay / 1000) + 's (cadenza dinamica 45s-85s) — Immobiliare Giancani');
    _timer = setTimeout(function() {
      _isArmed = true;
      console.log('[REGIA-AVATAR] 🎯 Primo Piano ARMATO: scatta alla prossima frase di qualunque conduttore! — Immobiliare Giancani');
    }, delay);
  }

  function attivaSeArmato(speakerName, testoFrase) {
    var tempoTrascors = Date.now() - _lastTriggerTime;
    // Scatta se armato dal timer variabile o come fallback se trascorsi oltre 85 secondi
    if (_isArmed || tempoTrascors >= 85000) {
      attivaPrimoPiano(speakerName);
      return true;
    }
    return false;
  }

  function attivaPrimoPiano(speakerName) {
    if (_isActive) return;
    _isActive = true;
    _isArmed = false;
    _lastTriggerTime = Date.now();

    var sNorm = (speakerName || 'daria').toLowerCase();
    var isLeft = (sNorm.indexOf('daria') !== -1);
    _currentActiveSide = isLeft ? 'left' : 'right';

    var nomeVisualizzato = speakerName ? speakerName.toUpperCase() : (isLeft ? 'DARIA' : 'DARIO');
    console.log('[REGIA-AVATAR] 🌟 ATTIVAZIONE INGRANDIMENTO/PRIMO PIANO: ' + nomeVisualizzato + ' (' + (isLeft ? 'LATO SINISTRO' : 'LATO DESTRO') + ') — Immobiliare Giancani');

    var backdrop = document.getElementById('daria-focus-backdrop');
    if (backdrop) backdrop.classList.add('active');

    if (isLeft) {
      var boxD = document.getElementById('box-sinistro-daria') || document.getElementById('daria-anchor-slot');
      var badgeD = document.getElementById('daria-closeup-badge');
      if (badgeD) badgeD.textContent = '✨ REGIA LIVE • IN ONDA ' + nomeVisualizzato;
      if (boxD) {
        boxD.classList.remove('daria-cinematic-return', 'avatar-cinematic-return');
        boxD.classList.add('daria-cinematic-focus', 'avatar-cinematic-focus');
      }
    } else {
      var boxO = document.getElementById('box-destro-ospiti');
      var badgeO = document.getElementById('dario-closeup-badge');
      if (badgeO) badgeO.textContent = '✨ REGIA LIVE • IN ONDA ' + nomeVisualizzato;
      if (boxO) {
        boxO.classList.remove('avatar-cinematic-return');
        boxO.classList.add('avatar-cinematic-focus');
      }
    }

    // Timer di sicurezza: chiude al massimo dopo 12s se la frase non scatta il finish
    if (_safetyTimeout) clearTimeout(_safetyTimeout);
    _safetyTimeout = setTimeout(function() {
      disattivaPrimoPiano();
    }, 12000);
  }

  function disattivaPrimoPiano() {
    if (!_isActive) return;
    _isActive = false;
    if (_safetyTimeout) clearTimeout(_safetyTimeout);

    console.log('[REGIA-AVATAR] ↩️ RITORNO FLUIDO AL PODIO STUDIO (Zoom Out & Ripristino) — Immobiliare Giancani');

    var backdrop = document.getElementById('daria-focus-backdrop');
    if (backdrop) backdrop.classList.remove('active');

    var boxD = document.getElementById('box-sinistro-daria') || document.getElementById('daria-anchor-slot');
    var boxO = document.getElementById('box-destro-ospiti');

    if (boxD) {
      boxD.classList.remove('daria-cinematic-focus', 'avatar-cinematic-focus');
      boxD.classList.add('daria-cinematic-return', 'avatar-cinematic-return');
    }
    if (boxO) {
      boxO.classList.remove('avatar-cinematic-focus');
      boxO.classList.add('avatar-cinematic-return');
    }

    // Rimuovi le classi di ritorno al termine dell'animazione (800ms)
    setTimeout(function() {
      if (boxD) boxD.classList.remove('daria-cinematic-return', 'avatar-cinematic-return');
      if (boxO) boxO.classList.remove('avatar-cinematic-return');
    }, 850);

    // Pianifica il prossimo primo piano
    pianificaProssimoPrimoPiano();
  }

  // Avvio rapido: primo close-up programmato a 25 secondi dall'inizio della diretta
  setTimeout(function() {
    _isArmed = true;
    pianificaProssimoPrimoPiano();
  }, 25000);

  // Monitor continuo di sicurezza per attivare quando un conduttore parla
  setInterval(function() {
    if (_isArmed && !_isActive) {
      var unitD = document.getElementById('unit-daria');
      var unitO = document.getElementById('unit-dario');
      if (unitD && unitD.classList.contains('speaking')) {
        attivaPrimoPiano('daria');
      } else if (unitO && unitO.classList.contains('speaking')) {
        attivaPrimoPiano('dario');
      }
    }
  }, 1000);

  return {
    attivaSeArmato: attivaSeArmato,
    attivaPrimoPiano: attivaPrimoPiano,
    disattivaPrimoPiano: disattivaPrimoPiano,
    isAttivo: function() { return _isActive; },
    forzaTrigger: function(spk) { attivaPrimoPiano(spk); }
  };
})();

// Alias retrocompatibile al 100% con qualsiasi chiamata precedente
window.DariaCloseUpManager = window.AvatarCloseUpManager;



/* ═══════════════════════════════════════════════════════════════════════
   📺 ROTATORE SPOT PUBBLICITARI SCHERMO CENTRALE
   Collegato al foglio 'Pubblicita_Schermo_Centrale' (Colonna B = Secondi)
   Gira foto e video promozionali con la cadenza in secondi per riga
   Personal Branding: Immobiliare Giancani
   ═══════════════════════════════════════════════════════════════════════ */
window.CentralScreenSpotManager = (function() {
  var _spotList = [
    {
      url: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200&auto=format&fit=crop',
      durataSec: 8,
      titolo: 'Immobiliare Giancani — Immobili Esclusivi',
      tipo: 'foto'
    }
  ];
  var _currentIdx = 0;
  var _timerRotation = null;
  var _inPausaPerDescrizione = false;

  function aggiornaSpot(listaNuova) {
    if (Array.isArray(listaNuova) && listaNuova.length > 0) {
      _spotList = listaNuova;
      console.log('[SCHERMO-CENTRALE] Caricati ' + _spotList.length + ' spot pubblicitari con cadenze in secondi.');
      if (!_inPausaPerDescrizione && !_timerRotation) {
        avviaRotazione();
      }
    }
  }

  function avviaRotazione() {
    if (_timerRotation) clearTimeout(_timerRotation);
    if (_inPausaPerDescrizione || _spotList.length === 0) return;

    var spot = _spotList[_currentIdx % _spotList.length];
    _mostraSpot(spot);

    var durataMs = Math.max((spot.durataSec || 8) * 1000, 3000);
    _timerRotation = setTimeout(function() {
      _currentIdx++;
      avviaRotazione();
    }, durataMs);
  }

  function _mostraSpot(spot) {
    var screenIdle = document.getElementById('screen-state-idle');
    var screenActive = document.getElementById('screen-state-active');
    var imgEl = document.getElementById('screen-media-img');
    var vidEl = document.getElementById('screen-media-video');
    var roomNameEl = document.getElementById('tech-room-name');
    var overlayEl = document.getElementById('screen-tech-overlay');

    if (!screenIdle || !screenActive) return;

    screenIdle.style.opacity = '0';
    screenIdle.style.display = 'none';
    screenActive.style.display = 'block';
    screenActive.style.opacity = '1';

    if (spot.tipo === 'video' && vidEl) {
      if (imgEl) imgEl.style.display = 'none';
      vidEl.style.display = 'block';
      vidEl.src = spot.url;
      vidEl.play().catch(function(){});
    } else if (imgEl) {
      if (vidEl) vidEl.style.display = 'none';
      imgEl.style.display = 'block';
      imgEl.src = spot.url;
    }

    if (roomNameEl) {
      roomNameEl.textContent = '📢 ' + (spot.titolo || 'Immobiliare Giancani').toUpperCase();
    }
    if (overlayEl) {
      overlayEl.style.display = 'block';
    }
  }

  function pausaPerDescrizioneStanza() {
    _inPausaPerDescrizione = true;
    if (_timerRotation) {
      clearTimeout(_timerRotation);
      _timerRotation = null;
    }
  }

  function riprendiRotazioneSpot() {
    _inPausaPerDescrizione = false;
    avviaRotazione();
  }

  // Avvio al caricamento
  setTimeout(function() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success && res.spot) {
            aggiornaSpot(res.spot);
          }
        })
        .getSpotSchermoCentrale();
    } else {
      avviaRotazione();
    }
  }, 2500);

  return {
    aggiornaSpot: aggiornaSpot,
    avviaRotazione: avviaRotazione,
    pausaPerDescrizioneStanza: pausaPerDescrizioneStanza,
    riprendiRotazioneSpot: riprendiRotazioneSpot
  };
})();
