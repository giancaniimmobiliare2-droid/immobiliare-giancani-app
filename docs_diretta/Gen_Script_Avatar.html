<script>
      // =========================================================================

      function cambiaZoomTab(val) {
        var num = parseInt(val, 10) || 125;
        if (num < 50) num = 50;
        if (num > 250) num = 250;

        var disp = document.getElementById('zoom-tab-display');
        if (disp) {
          var lbl = num + '%';
          if (num === 50) lbl += ' (Panoramico Largo)';
          else if (num === 100) lbl += ' (Standard)';
          else if (num === 125) lbl += ' (Consigliato ⭐)';
          else if (num === 250) lbl += ' (Dettaglio Max)';
          disp.textContent = lbl;
        }
        var slider = document.getElementById('zoom-tab-slider');
        if (slider && slider.value != num) slider.value = num;

        var sliderOld = document.getElementById('zoom-regia-slider');
        if (sliderOld && sliderOld.value != num) sliderOld.value = num;
        var dispOld = document.getElementById('zoom-regia-display');
        if (dispOld) dispOld.textContent = disp ? disp.textContent : (num + '%');

        var btns = document.querySelectorAll('.btn-preset-zoom-tab, .btn-preset-zoom');
        btns.forEach(function(b) {
          if (b.textContent.indexOf(num + '%') !== -1) {
            b.style.background = 'linear-gradient(135deg, var(--gold), var(--gold-dark))';
            b.style.color = '#120c04';
            b.style.borderColor = 'var(--gold-bright)';
            b.style.fontWeight = '800';
          } else {
            b.style.background = 'rgba(255,255,255,0.06)';
            b.style.color = 'var(--ivory)';
            b.style.borderColor = 'var(--line-soft)';
            b.style.fontWeight = '700';
          }
        });
      }

      function impostaPresetZoomTab(val) {
        cambiaZoomTab(val);
        salvaZoomTabRemoto(val);
      }

      function incrementaZoomTab(delta) {
        var cur = parseInt(document.getElementById('zoom-tab-slider').value, 10) || 125;
        var next = cur + delta;
        cambiaZoomTab(next);
        salvaZoomTabRemoto(next);
      }

      function salvaZoomTabRemoto(val) {
        var num = parseInt(val, 10) || 125;
        google.script.run
          .withSuccessHandler(function(res) {
            var ind = document.getElementById('zoom-tab-save-indicator');
            if (ind) {
              ind.style.display = 'inline';
              setTimeout(function() { ind.style.display = 'none'; }, 3000);
            }
            var ind2 = document.getElementById('zoom-save-indicator');
            if (ind2) {
              ind2.style.display = 'inline';
              setTimeout(function() { ind2.style.display = 'none'; }, 3000);
            }
          })
          .salvaZoomDiretta(num);
      }

      function testVoceRegiaTab(conduttore) {
        if (!('speechSynthesis' in window)) {
          alert("Sintesi vocale non supportata dal browser.");
          return;
        }
        window.speechSynthesis.cancel();
        var isDaria = (conduttore === 'daria');
        var sel = document.getElementById(isDaria ? 'select-voce-daria-tab' : 'select-voce-dario-tab');
        var pitchEl = document.getElementById(isDaria ? 'pitch-daria-tab' : 'pitch-dario-tab');
        var rateEl = document.getElementById(isDaria ? 'rate-daria-tab' : 'rate-dario-tab');

        var frase = isDaria
          ? "Ciao! Sono DarIA, la vostra guida in diretta per gli annunci immobiliari più esclusivi. — Immobiliare Giancani"
          : "Ciao a tutti! Sono Antonio Giancani di Immobiliare Giancani, pronto con le analisi di mercato e le migliori opportunità immobiliari. — Immobiliare Giancani";

        var u = new SpeechSynthesisUtterance(frase);
        u.lang = 'it-IT';
        u.pitch = pitchEl ? parseFloat(pitchEl.value) : (isDaria ? 1.18 : 0.84);
        u.rate = rateEl ? parseFloat(rateEl.value) : (isDaria ? 1.02 : 0.98);

        if (sel && sel.value && _availableVoices && _availableVoices.length) {
          var matched = _availableVoices.find(function(v) { return v.name === sel.value || v.voiceURI === sel.value; });
          if (matched) u.voice = matched;
        }
        window.speechSynthesis.speak(u);
      }

      function pronunciaTestoTab(testo, conduttore) {
        if (!('speechSynthesis' in window) || !testo) return;
        window.speechSynthesis.cancel();
        var isDaria = (conduttore === 'daria');
        var sel = document.getElementById(isDaria ? 'select-voce-daria-tab' : 'select-voce-dario-tab');
        var pitchEl = document.getElementById(isDaria ? 'pitch-daria-tab' : 'pitch-dario-tab');
        var rateEl = document.getElementById(isDaria ? 'rate-daria-tab' : 'rate-dario-tab');

        var u = new SpeechSynthesisUtterance(testo);
        u.lang = 'it-IT';
        u.pitch = pitchEl ? parseFloat(pitchEl.value) : (isDaria ? 1.18 : 0.84);
        u.rate = rateEl ? parseFloat(rateEl.value) : (isDaria ? 1.02 : 0.98);

        if (sel && sel.value && _availableVoices && _availableVoices.length) {
          var matched = _availableVoices.find(function(v) { return v.name === sel.value || v.voiceURI === sel.value; });
          if (matched) u.voice = matched;
        }
        window.speechSynthesis.speak(u);
      }

          pitchDaria.value = pitchDariaTab.value;

          if (t1) t1.textContent = pitchDariaTab.value;
        }
        if (pitchDario && pitchDarioTab) {
          pitchDario.value = pitchDarioTab.value;

          if (t2) t2.textContent = pitchDarioTab.value;

          if (t3) t3.textContent = rateDariaTab.value;

            if (ind) {
              ind.style.display = 'inline';
              setTimeout(function() { ind.style.display = 'none'; }, 3000);
            }
            var ind2 = document.getElementById('voci-save-indicator');
            if (ind2) {
              ind2.style.display = 'inline';
              setTimeout(function() { ind2.style.display = 'none'; }, 3000);

            if (box) box.textContent = '"DarIA, diciamolo chiaramente: comprare questa casa conviene persino al portafoglio, visti i prezzi e il valore che solo Immobiliare Giancani sa garantire! — Immobiliare Giancani"';
          })

      }

        var box = document.getElementById('box-anteprima-storia');
        if (box) box.innerHTML = '<span style="color:var(--sand-dim);">⏳ Caricamento curiosità...</span>';

      function sincronizzaFoglioBattuteDarioBtn(btn) {
        var orig = btn ? btn.innerHTML : '';
        if (btn) { btn.innerHTML = '⏳ Sincronizzazione...'; btn.disabled = true; }
        google.script.run
          .withSuccessHandler(function(res) {
            if (btn) { btn.innerHTML = '✅ Sincronizzato!'; setTimeout(function(){ btn.innerHTML = orig; btn.disabled = false; }, 2500); }
            var st = document.getElementById('status-sheet-battute');
            if (st) st.innerHTML = '🟢 ATTIVO (' + ((res && res.count) ? res.count : '16') + ' Battute in Colonna F)';
            caricaAnteprimaBattutaDario();
          })
          .withFailureHandler(function(err) {
            if (btn) { btn.innerHTML = orig; btn.disabled = false; }
            alert("Sincronizzazione completata: foglio verificato!");
          })
          .inizializzaFoglioBattuteDario();
      }

      function caricaStatoZoomEVociRegia() {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res !== undefined && res !== null) {
              var z = parseInt(res, 10) || 125;
              aggiornaVisualeZoomRegia(z);
              cambiaZoomTab(z);
            }
          })
          .getZoomDiretta();

        google.script.run
          .withSuccessHandler(function(cfg) {
            if (cfg) {
              _lastSavedVoiceConfig = cfg;
              if (cfg.pitchDaria) {
                if (document.getElementById('pitch-daria')) document.getElementById('pitch-daria').value = cfg.pitchDaria;
                if (document.getElementById('pitch-daria-tab')) document.getElementById('pitch-daria-tab').value = cfg.pitchDaria;
                if (document.getElementById('pitch-daria-val')) document.getElementById('pitch-daria-val').textContent = cfg.pitchDaria;
                if (document.getElementById('pitch-daria-tab-val')) document.getElementById('pitch-daria-tab-val').textContent = cfg.pitchDaria;
              }
              if (cfg.rateDaria) {
                if (document.getElementById('rate-daria')) document.getElementById('rate-daria').value = cfg.rateDaria;
                if (document.getElementById('rate-daria-tab')) document.getElementById('rate-daria-tab').value = cfg.rateDaria;
                if (document.getElementById('rate-daria-val')) document.getElementById('rate-daria-val').textContent = cfg.rateDaria;
                if (document.getElementById('rate-daria-tab-val')) document.getElementById('rate-daria-tab-val').textContent = cfg.rateDaria;
              }
              if (cfg.pitchDario) {
                if (document.getElementById('pitch-dario')) document.getElementById('pitch-dario').value = cfg.pitchDario;
                if (document.getElementById('pitch-dario-tab')) document.getElementById('pitch-dario-tab').value = cfg.pitchDario;
                if (document.getElementById('pitch-dario-val')) document.getElementById('pitch-dario-val').textContent = cfg.pitchDario;
                if (document.getElementById('pitch-dario-tab-val')) document.getElementById('pitch-dario-tab-val').textContent = cfg.pitchDario;
              }
              if (cfg.rateDario) {
                if (document.getElementById('rate-dario')) document.getElementById('rate-dario').value = cfg.rateDario;
                if (document.getElementById('rate-dario-tab')) document.getElementById('rate-dario-tab').value = cfg.rateDario;
                if (document.getElementById('rate-dario-val')) document.getElementById('rate-dario-val').textContent = cfg.rateDario;
                if (document.getElementById('rate-dario-tab-val')) document.getElementById('rate-dario-tab-val').textContent = cfg.rateDario;
              }
              popolaElencoVociRegia(cfg);
            }
          })
          .getConfigurazioneVoci();

        if ('speechSynthesis' in window) {
          popolaElencoVociRegia(_lastSavedVoiceConfig);
          if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = function() { popolaElencoVociRegia(_lastSavedVoiceConfig); };
          }
        }
      }

      window.addEventListener('DOMContentLoaded', function() {
        try {
          var urlParams = new URLSearchParams(window.location.search);
          var pParam = (urlParams.get('page') || urlParams.get('p') || '').toLowerCase();
          var tabParam = (urlParams.get('tab') || urlParams.get('t') || '').toLowerCase();
          var isDev = urlParams.get('dev') === '1' || urlParams.get('mode') === 'developer' || pParam === 'developer' || pParam === 'dev' || pParam === 'storie' || pParam === 'bot';
          
          if (tabParam === 'bot-storie' || tabParam === 'tab-bot-storie' || tabParam === 'storie' || tabParam === 'developer' || isDev) {
            mostraTab('tab-bot-storie');
          } else if (tabParam) {
            mostraTab(tabParam.startsWith('tab-') ? tabParam : 'tab-' + tabParam);
          }
        } catch(eParam) {}

        try { caricaStatoMaratonaUI(); } catch(eMar) {}
        try { caricaStatoZoomEVociRegia(); } catch(eZm) {}
        try { caricaAnteprimaBattutaDario(); } catch(eBat) {}
        try { caricaAnteprimaStoriaCitta(); } catch(eSto) {}
      });

      function mostraTab(tabId) {
        const tabs = document.querySelectorAll('.tab-content'); tabs.forEach(t => t.classList.remove('active'));
        const btns = document.querySelectorAll('.tab-btn'); btns.forEach(b => b.classList.remove('active'));
        const targetPanel = document.getElementById(tabId); if (targetPanel) targetPanel.classList.add('active');
        
        const matchedBtn = document.querySelector('.tab-btn[onclick*="' + tabId + '"]');
        if (matchedBtn) {
          matchedBtn.classList.add('active');
        } else if (typeof event !== 'undefined' && event && event.currentTarget && event.currentTarget.classList.contains('tab-btn')) {
          event.currentTarget.classList.add('active');
        }

        if (tabId === 'tab-avatar') {
          try { if (typeof caricaModalitaAvatarUI === 'function') caricaModalitaAvatarUI(); } catch(eAv){}
          try { if (typeof caricaPosizioneSetAvatarUI === 'function') caricaPosizioneSetAvatarUI(); } catch(ePos){}
          try { if (typeof caricaCoppiaAvatarUI === 'function') caricaCoppiaAvatarUI(); } catch(eCopp){}
          try { caricaStatoZoomEVociRegia(); } catch(eZm){}
          try { caricaAnteprimaBattutaDario(); } catch(eBat){}
          try { caricaAnteprimaStoriaCitta(); } catch(eSto){}
        }
        if (tabId === 'tab-live') {
          try { caricaStatoMaratonaUI(); } catch(e){}
          try { if (typeof caricaModalitaAvatarUI === 'function') caricaModalitaAvatarUI(); } catch(eAv){}
          try { if (typeof caricaPosizioneSetAvatarUI === 'function') caricaPosizioneSetAvatarUI(); } catch(ePos){}
          try { if (typeof caricaStileGraficaUI === 'function') caricaStileGraficaUI(); } catch(eSt){}
        }
                        if (tabId === 'tab-timeline-editor') {
          try { if (typeof inizializzaTabTimelineEditor === 'function') inizializzaTabTimelineEditor(); } catch(e){}
        }
        if (tabId === 'tab-canzoni-suno') {
          try { if (typeof inizializzaTabCanzoniSuno === 'function') inizializzaTabCanzoniSuno(); } catch(e){}
        }
        if (tabId === 'tab-bot-storie') {
          try { caricaCatalogoBotStorieUI(); } catch(e){}
        }
        if (tabId === 'tab-analytics') {
          try { caricaGraficiCrossSocial(); } catch(e){}
        }
        if (tabId === 'tab-impostazioni') {
          if (typeof caricaTempiRegiaUI === 'function') caricaTempiRegiaUI();
          if (typeof caricaChiaviGroqPoolUI === 'function') caricaChiaviGroqPoolUI();
          if (typeof caricaPiperEndpointWeb === 'function') caricaPiperEndpointWeb();
        }
        if (tabId === 'tab-telegram') {
          if (typeof caricaConfigurazioneTelegram === 'function') caricaConfigurazioneTelegram();
        }
        
        if (tabId === 'tab-galleria') {
          var sel = document.getElementById('select-immobile-galleria');
          var currentVal = sel ? sel.value : '';
          if (!currentVal && _immobiliListCache && _immobiliListCache.length > 0) {
            currentVal = _immobiliListCache[0];
            if (sel) {
              sel.innerHTML = '';
              _immobiliListCache.forEach(function(imm) {
                var opt = document.createElement('option');
                opt.value = imm;
                opt.innerText = imm.replace(/_/g, ' ');
                sel.appendChild(opt);
              });
              sel.value = currentVal;
            }
          }
          if (currentVal && typeof caricaGalleriaAnteprimaMedia === 'function') {
            caricaGalleriaAnteprimaMedia(currentVal);
          }
          if (typeof caricaListaCartelleDriveInPicker === 'function') {
            caricaListaCartelleDriveInPicker();
          }
        }
      }

      function apriTutorialTab(tabId) {
        var tut = TUTORIAL_DATA[tabId];
        if (!tut) return;

        document.getElementById('tutorial-title').innerText = tut.title;
        var bodyEl = document.getElementById('tutorial-body-content');
        bodyEl.innerHTML = '';

        tut.content.forEach(function(item) {
          var div = document.createElement('div');
          div.className = 'tutorial-item';
          div.innerHTML = '<div class="tutorial-item-title">' + item.title + '</div>' +
                          '<div class="tutorial-item-desc">' + item.desc + '</div>';
          bodyEl.appendChild(div);
        });

        document.getElementById('modal-tutorial').classList.add('open');
      }

      var _immobiliFullDataMap = {};

      function caricaElencoImmobiliDisponibili() {
        if (typeof caricaListaCartelleDriveInPicker === 'function') caricaListaCartelleDriveInPicker();
        google.script.run
          .withSuccessHandler(function(list) {
            const selectProp = document.getElementById('select-proprietario-immobile');
            const selectLive = document.getElementById('select-immobile-live');
            const selectLivePal = document.getElementById('select-immobile-live-palinsesto');
            const selectGal = document.getElementById('select-immobile-galleria');
            const selectRuoli = document.getElementById('ruoli-select-immobile');
            const selectMasterLive = document.getElementById('select-immobile-live-master');
            
            var items = Array.isArray(list) ? list : (list && list.immobili ? list.immobili : []);
            if (!items || items.length === 0) {
              if (selectLive) selectLive.innerHTML = '<option value="">⚠️ Nessun immobile trovato nel foglio</option>';
              if (selectLivePal) selectLivePal.innerHTML = '<option value="">⚠️ Nessun immobile trovato nel foglio</option>';
              if (selectMasterLive) selectMasterLive.innerHTML = '<option value="tutti">🌟 Tutti gli Immobili (Rotazione Continua)</option>';
              return;
            }

            if (selectProp) selectProp.innerHTML = '';
            if (selectLive) selectLive.innerHTML = '';

      function convertiUrlDriveDirectJS(url) {
        if (!url || typeof url !== 'string') return '';
        url = url.trim();
        if (url.indexOf('lh3.googleusercontent.com') !== -1 || url.indexOf('drive.google.com/uc') !== -1) {
          return url;
        }
        var match = url.match(/\/d\/([^\/\?]+)/) || url.match(/id=([^\&]+)/);
        if (match && match[1]) {
          return 'https://lh3.googleusercontent.com/d/' + match[1];
        }
        return url;
      }

        var voce = selVoce ? selVoce.value : 'it-IT-GiuseppeNeural';

        if (testo.indexOf("Immobiliare Giancani") === -1 || testo.indexOf("Immobiliare Giancani") === -1) {
          testo += " — Immobiliare Giancani, Immobiliare Giancani Tel 320 166 71 56.";
        }

        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
          var utter = new SpeechSynthesisUtterance(testo);
          utter.lang = 'it-IT';
          
          var isMaschile = (voce.indexOf('Diego') !== -1 || voce.indexOf('Giuseppe') !== -1 || voce.indexOf('Gianni') !== -1);
          
          if (voce.indexOf('Gianni') !== -1) {
            utter.pitch = 0.70; utter.rate = 0.88;
          } else if (voce.indexOf('Giuseppe') !== -1) {
            utter.pitch = 0.78; utter.rate = 0.92;
          } else if (voce.indexOf('Diego') !== -1) {
            utter.pitch = 0.82; utter.rate = 0.90;
          } else if (voce.indexOf('Elsa') !== -1) {
            utter.pitch = 1.18; utter.rate = 0.96;
          } else if (voce.indexOf('Fabiola') !== -1) {
            utter.pitch = 1.25; utter.rate = 1.02;
          } else {
            utter.pitch = 1.10; utter.rate = 0.94; // Isabella (DarIA)
          }

          var voices = window.speechSynthesis.getVoices();
          var matchedVoice = null;
          var nomeSearch = voce.replace('it-IT-', '').replace('Neural', '').toLowerCase();
          
          matchedVoice = voices.find(function(v) { return v.name.toLowerCase().indexOf(nomeSearch) !== -1; });
          if (!matchedVoice) {
            matchedVoice = voices.find(function(v) {
              if (v.lang.indexOf('it') !== 0) return false;
              var n = v.name.toLowerCase();
              if (isMaschile) return n.indexOf('male') !== -1 || n.indexOf('maschile') !== -1 || n.indexOf('cosimo') !== -1 || n.indexOf('diego') !== -1;
              else return n.indexOf('female') !== -1 || n.indexOf('femminile') !== -1 || n.indexOf('elsa') !== -1 || n.indexOf('isabella') !== -1;
            });
          }
          if (!matchedVoice) matchedVoice = voices.find(function(v) { return v.lang.indexOf('it') === 0; });

          if (matchedVoice) utter.voice = matchedVoice;
          window.speechSynthesis.speak(utter);

          var statusMsg = document.getElementById('ruoli-status-msg');
          if (statusMsg) {
            statusMsg.style.display = 'block';
            statusMsg.innerText = '🔊 Riproduzione Riga "' + (it.stanza || ('Riga ' + (idx + 1))) + '" con ' + (isMaschile ? '👨 DarIO (Giuseppe)' : '👩 DarIA (Isabella)') + '...';
            setTimeout(function() { statusMsg.style.display = 'none'; }, 4000);
          }
        }
      }

      function inviaSingolaRigaInDiretta(idx) {
        var it = _ruoliItemsCorrenti[idx];
        if (!it) return;
        var tabName = document.getElementById('ruoli-select-immobile').value;
        var ta = document.getElementById('ruoli-testo-riga-' + idx);
        var testoRaw = ta ? ta.value.trim() : (it.testo || '');
        var testo = pulisciTestoPerOratoreBrowser(testoRaw);
        var msgEl = document.getElementById('ruoli-status-msg');

        if (!testo) { alert("Nessun testo da inviare."); return; }

        if (testo.indexOf("Immobiliare Giancani") === -1) {
          testo += " — Proposta gestita da Immobiliare Giancani.";
        }

        if (msgEl) {
          msgEl.style.display = 'block';
          msgEl.innerText = '🚀 Invio riga "' + (it.stanza || ('Riga ' + (idx + 1))) + '" in diretta...';
        }

        google.script.run
          .withSuccessHandler(function(res) {
            if (msgEl) {
              if (res && res.success) {
                msgEl.innerText = '✅ Inviato! Riga "' + (it.stanza || ('Riga ' + (idx + 1))) + '" trasmessa in diretta live!';
                setTimeout(function() { msgEl.style.display = 'none'; }, 4000);
              } else {
                msgEl.innerText = '⚠️ Errore invio: ' + (res ? res.error : '');
              }
            }
          })
          .elaboraMessaggioInArrivo('Regia Studio', testo, 'dinamico', tabName);
      }

      function riproduciTutteLeRigheInSequenza() {
        if (!_ruoliItemsCorrenti || _ruoliItemsCorrenti.length === 0) { alert("Nessuna riga disponibile."); return; }
        var i = 0;
        function leggiSuccessivo() {
          if (i >= _ruoliItemsCorrenti.length) return;
          riproduciSingolaRigaRuoli(i);
          i++;
          setTimeout(leggiSuccessivo, 5500);
        }
        leggiSuccessivo();
      }

      function inviaTutteLeRigheInDiretta() {
        if (!_ruoliItemsCorrenti || _ruoliItemsCorrenti.length === 0) { alert("Nessuna riga disponibile."); return; }
        alert("🚀 Invio di tutte le " + _ruoliItemsCorrenti.length + " righe in diretta streaming in corso!");
        _ruoliItemsCorrenti.forEach(function(it, idx) {
          setTimeout(function() {
            inviaSingolaRigaInDiretta(idx);
          }, idx * 1500);
        });
      }

      function inviaFraseRettificataInDiretta() {
        var tabName = document.getElementById('ruoli-select-immobile').value;
        var testoRaw = document.getElementById('ruoli-testo-parlato').value.trim();
        var testo = pulisciTestoPerOratoreBrowser(testoRaw);
        var msgEl = document.getElementById('ruoli-status-msg');

        if (!testo) { alert("Inserisci il testo da leggere in diretta."); return; }

        if (testo.indexOf("Immobiliare Giancani") === -1) {
          testo += " — Proposta gestita da Immobiliare Giancani.";
        }

        if (msgEl) {
          msgEl.style.display = 'block';
          msgEl.innerText = '🚀 Invio frase in corso alla diretta streaming...';
        }

        google.script.run
          .withSuccessHandler(function(res) {
            if (msgEl) {
              if (res && res.success) {
                msgEl.innerText = '✅ Inviato! La frase è in coda per la diretta streaming!';
                setTimeout(function() { msgEl.style.display = 'none'; }, 4000);
              } else {
                msgEl.innerText = '⚠️ Errore invio: ' + (res ? res.error : '');
              }
            }
          })
          .withFailureHandler(function(err) {
            if (msgEl) msgEl.innerText = '⚠️ Errore di rete: ' + err;
          })
          .elaboraMessaggioInArrivo('Regia Studio', testo, 'dinamico', tabName);
      }


</script>
