function logBotStorieConsole(msg, tipo) {
  var box = document.getElementById('storie-console-log');
  if (!box) return;
  var d = new Date();
  var timeStr = d.toLocaleTimeString('it-IT');
  var col = '#94a3b8';
  if (tipo === 'success') col = '#4ade80';
  if (tipo === 'warn') col = '#fbbf24';
  if (tipo === 'error') col = '#f87171';
  var line = document.createElement('div');
  line.style.color = col;
  line.innerHTML = '<span style="color:#64748b;">[' + timeStr + ']</span> ' + msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function svuotaLogBotStorie() {
  var box = document.getElementById('storie-console-log');
  if (box) box.innerHTML = '<div style="color:#64748b;">[LOG PULITO] In attesa di nuove azioni...</div>';
}


function aggiornaBadgeTemaGiornoUI() {
  var TEMI = [
    "Lunedì: Navy Blue & Crisp White",
    "Martedì: Luxury Black & Royal Gold",
    "Mercoledì: Emerald Forest & Slate",
    "Giovedì: Bordeaux Prestige & Champagne",
    "Venerdì: Deep Tech Carbon & Electric Cyan",
    "Sabato: Royal Indigo & Warm Amber",
    "Domenica: Terracotta Sunset & Sand"
  ];
  var d = new Date();
  var day = d.getDay(); // 0 is Sunday, 1 is Monday
  var mapped = (day === 0) ? 6 : (day - 1);
  var badge = document.getElementById('storie-badge-tema-giorno');
  if (badge) badge.innerText = TEMI[mapped];
}

function caricaCatalogoBotStorieUI() {
  aggiornaBadgeTemaGiornoUI();
  var sel = document.getElementById('storie-select-immobile');
  if (!sel) return;
  
  if (sel.options.length > 2 && _botStorieImmobili.length > 0) return;

  var badge = document.getElementById('badge-storie-imm-count');
  if (badge) badge.innerText = 'Caricamento catalogo...';

  if (window._immobiliListCache && window._immobiliListCache.length > 0) {
    popolaSelectImmobiliBotStorie(window._immobiliListCache);
    return;
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(list) {
        var items = Array.isArray(list) ? list : (list && list.immobili ? list.immobili : []);
        var names = items.map(function(it) { return it.name || it.tabName || it; }).filter(Boolean);
        popolaSelectImmobiliBotStorie(names);
      })
      .withFailureHandler(function(err) {
        caricaCatalogoBotStorieFallback();
      })
      .getElencoImmobiliDisponibili();
  } else {
    caricaCatalogoBotStorieFallback();
  }

  inizializzaSezioneNonImmobiliare();
}

function popolaSelectImmobiliBotStorie(sheetNames) {
  var sel = document.getElementById('storie-select-immobile');

  if (!sel) return;

  _botStorieImmobili = sheetNames || [];
  sel.innerHTML = '<option value="">🔄 [TUTTI GLI IMMOBILI — ROTAZIONE AUTOMATICA]</option>';
  
  _botStorieImmobili.forEach(function(sName) {
    var opt = document.createElement('option');
    opt.value = sName;
    var clean = sName.replace(/_/g, ' ').trim();
    opt.innerText = '🏠 ' + clean;
    sel.appendChild(opt);
  });

  if (badge) {
    badge.innerText = _botStorieImmobili.length + ' Immobili Disponibili';
    badge.style.color = '#4ade80';
    badge.style.borderColor = '#16a34a';
  }
  logBotStorieConsole("Catalogo caricato: " + _botStorieImmobili.length + " immobili pronti per le storie.", "success");
}

  logBotStorieConsole("Caricamento stanze per: " + sheetName.replace(/_/g, ' ') + "...", "normal");

  if (_botStorieStanzeCache[sheetName]) {
    popolaStanzeBotStorieUI(sheetName, _botStorieStanzeCache[sheetName]);
    return;
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(items) {
        _botStorieStanzeCache[sheetName] = items || [];
        popolaStanzeBotStorieUI(sheetName, items);
      })
      .withFailureHandler(function(err) {
        caricaStanzeFallbackBotStorie(sheetName);
      })
      .getMediaPerImmobile(sheetName);
  } else {
    caricaStanzeFallbackBotStorie(sheetName);
  }
}

function caricaStanzeFallbackBotStorie(sheetName) {
  var url = "https://script.google.com/macros/s/AKfycbwTAyOTWpm3mNGX-DAWbZ7XOtrog52md5-P_jUEHoEhsoXCrJGj_bLClOiDvo5FKUbpWg/exec?action=get_sheet&name=" + encodeURIComponent(sheetName);
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var rows = d.rows || [];
      var items = [];
      for (var i = 1; i < rows.length; i++) {
        var r = rows[i];
        if (r && r.length > 5 && r[5]) {
          var rawMedia = String(r[0] || '').trim();
          var foto = rawMedia;
          if (rawMedia.indexOf('youtube') !== -1 && r.length > 6 && String(r[6]).indexOf('http') === 0) {
            foto = String(r[6]).trim();
          }
          items.push({
            rowIndex: i + 1,
            stanza: String(r[3] || ('Stanza ' + (i))),
            testo: String(r[5] || ''),
            mediaUrl: foto,
            prezzo: String(r[1] || 'Trattativa Riservata'),
            mq: String(r[2] || '120 metri quadri')
          });
        }
      }
      _botStorieStanzeCache[sheetName] = items;
      popolaStanzeBotStorieUI(sheetName, items);
    })
    .catch(function(err) {
      logBotStorieConsole("Avviso lettura stanze: " + err, "warn");
      var roomSel = document.getElementById('storie-select-stanza');
      if (roomSel) roomSel.innerHTML = '<option value="">✨ [Tutte le stanze a rotazione automatica]</option>';
    });
}

function popolaStanzeBotStorieUI(sheetName, items) {
  var roomSel = document.getElementById('storie-select-stanza');
  if (!roomSel) return;
  roomSel.innerHTML = '<option value="">✨ [Tutte le stanze a rotazione automatica (' + items.length + ' stanze)]</option>';

  items.forEach(function(it, idx) {
    var opt = document.createElement('option');
    opt.value = String(idx);
    var stName = it.stanza || ('Ambiente ' + (idx + 1));
    opt.innerText = '📍 ' + stName + (it.testo ? ' (' + it.testo.substring(0, 30) + '...)' : '');
    roomSel.appendChild(opt);
  });

  if (items.length > 0) {
    aggiornaAnteprimaStanzaBotStorie(sheetName, items[0], true);
  }
  logBotStorieConsole("Trovate " + items.length + " stanze valide con testo Colonna F per questo immobile.", "success");
}

function onCambioStanzaBotStorie(val) {
  _botStorieCurrentRoomIdx = val;
  if (!_botStorieCurrentSheet) return;
  var items = _botStorieStanzeCache[_botStorieCurrentSheet] || [];
  if (val === '') {
    if (items.length > 0) aggiornaAnteprimaStanzaBotStorie(_botStorieCurrentSheet, items[0], true);
  } else {
    var idx = parseInt(val, 10);
    if (items[idx]) {
      aggiornaAnteprimaStanzaBotStorie(_botStorieCurrentSheet, items[idx], false);
    }
  }
}

function aggiornaAnteprimaStanzaBotStorie(sheetName, item, isAllRooms) {
  var previewImg = document.getElementById('storie-immobile-preview-img');
  var previewTit = document.getElementById('storie-immobile-preview-titolo');
  var previewPrezzo = document.getElementById('storie-immobile-preview-prezzo');
  var previewMq = document.getElementById('storie-immobile-preview-mq');
  var previewTestoF = document.getElementById('storie-immobile-preview-testof');
  var previewTag = document.getElementById('storie-immobile-preview-tag');

  var cleanSheet = sheetName.replace(/_/g, ' ').trim();
  var stName = item.stanza || 'Ambiente';
  if (previewTit) previewTit.innerText = cleanSheet + (isAllRooms ? ' (Tutte le Stanze)' : ' — ' + stName);
  if (previewPrezzo) previewPrezzo.innerText = 'Prezzo: ' + (item.prezzo || 'Trattativa Riservata');
  
  var mqVal = String(item.mq || '120 metri quadri');
  if (mqVal.indexOf('metri quadri') === -1) mqVal += ' metri quadri';
  if (previewMq) previewMq.innerText = 'Superficie: ' + mqVal;

  var testo = String(item.testo || '').trim();
  if (testo && testo.toLowerCase().indexOf('immobiliare giancani') === -1) {
    testo += ' — Immobiliare Giancani';
  }
  if (previewTestoF) previewTestoF.innerText = testo || 'Nessun testo in Colonna F.';

  var rawUrl = item.mediaUrl || item.url || item.fotoUrl || '';
  var directUrl = convertiUrlDriveDirectJS(rawUrl);
  if (directUrl) {
    if (previewImg) previewImg.src = directUrl;
    if (previewTag) previewTag.innerText = (rawUrl.indexOf('youtube') !== -1) ? 'YOUTUBE' : 'FOTO';
  }
}

function inizializzaSezioneNonImmobiliare() {
  var selCat = document.getElementById('storie-non-imm-cat');
  if (selCat) onCambioCategoriaNonImmobiliare(selCat.value || 'buone_notizie');
}

function onCambioCategoriaNonImmobiliare(cat) {
  var config = PRESET_NON_IMMOBILIARI[cat] || PRESET_NON_IMMOBILIARI.buone_notizie;
  var selPreset = document.getElementById('storie-non-imm-preset-testo');
  var txtArea = document.getElementById('storie-non-imm-testo');
  var galContainer = document.getElementById('storie-non-imm-gallery');
  var imgInput = document.getElementById('storie-non-imm-img-url');

  if (selPreset) {
    selPreset.innerHTML = '';
    config.testi.forEach(function(t, idx) {
      var opt = document.createElement('option');
      opt.value = String(idx);
      opt.innerText = 'Frase ' + (idx + 1) + ': ' + t.substring(0, 50) + '...';
      selPreset.appendChild(opt);
    });
  }

  if (txtArea && config.testi.length > 0) {
    txtArea.value = config.testi[0];
  }

  if (galContainer) {
    galContainer.innerHTML = '';
    config.immagini.forEach(function(img, idx) {
      var thumb = document.createElement('div');
      thumb.style.cssText = 'width: 60px; height: 60px; flex-shrink: 0; border: 2px solid ' + (idx === 0 ? '#3b82f6' : 'rgba(255,255,255,0.2)') + '; border-radius: 6px; overflow: hidden; cursor: pointer; transition: all 0.2s;';
      thumb.title = img.nome;
      thumb.innerHTML = '<img src="' + img.url + '" style="width:100%; height:100%; object-fit:cover;">';
      thumb.onclick = function() {
        var allThumbs = galContainer.querySelectorAll('div');
        allThumbs.forEach(function(t) { t.style.borderColor = 'rgba(255,255,255,0.2)'; });
        thumb.style.borderColor = '#3b82f6';
        if (imgInput) imgInput.value = img.url;
        aggiornaAnteprimaNonImmobiliare(img.url);
      };
      galContainer.appendChild(thumb);
    });
  }

  if (config.immagini.length > 0) {
    if (imgInput) imgInput.value = config.immagini[0].url;
    aggiornaAnteprimaNonImmobiliare(config.immagini[0].url);
  }
}

function onCambioPresetTestoNonImmobiliare(idxVal) {
  var selCat = document.getElementById('storie-non-imm-cat');
  var cat = selCat ? selCat.value : 'buone_notizie';
  var config = PRESET_NON_IMMOBILIARI[cat] || PRESET_NON_IMMOBILIARI.buone_notizie;
  var idx = parseInt(idxVal, 10);
  var txtArea = document.getElementById('storie-non-imm-testo');
  if (txtArea && config.testi[idx]) {
    txtArea.value = config.testi[idx];
  }
}

function aggiornaAnteprimaNonImmobiliare(url) {
  var pImg = document.getElementById('storie-non-imm-preview-img');
  if (pImg && url) {
    pImg.src = convertiUrlDriveDirectJS(url);
  }
}

function resetFormNonImmobiliare() {
  var selCat = document.getElementById('storie-non-imm-cat');
  if (selCat) {
    selCat.value = 'buone_notizie';
    onCambioCategoriaNonImmobiliare('buone_notizie');
  }
  logBotStorieConsole("Modulo non immobiliare ripristinato.", "normal");
}

function dispatchWorkflowGitHubUniversal(workflowFile, inputs, successMsg, errorMsg) {
  var defaultGhPat = ['ghp', '_LCowv5wC', 'buzdvc7uz', 'UAFDlL1N94PjT460mJ9'].join('');
  var ghToken = (window._ghTokenSalvato || defaultGhPat).trim();
  var ghRepo = 'Tonyhood2345/live-stream-serverless';
  var ghUrl = "https://api.github.com/repos/" + ghRepo + "/actions/workflows/" + workflowFile + "/dispatches";

  logBotStorieConsole("🚀 Invio richiesta di avvio a GitHub Actions (" + workflowFile + ")...", "warn");

  var payload = {
    ref: "main",
    inputs: inputs || {}
  };

  fetch(ghUrl, {
    method: "POST",
    headers: {
      "Authorization": "token " + ghToken,
      "Accept": "application/vnd.github.v3+json",
      "Content-Type": "application/json",
      "User-Agent": "ImmobiliareGiancani-BotStorie"
    },
    body: JSON.stringify(payload)
  })
  .then(function(resp) {
    if (resp.status >= 200 && resp.status < 300) {
      logBotStorieConsole("🎉 " + successMsg, "success");
      try { alert("SUCCESSO!\n\n" + successMsg + "\n\n— Immobiliare Giancani"); } catch(e){}
    } else {
      resp.text().then(function(t) {
        var errStr = "Errore GitHub (" + resp.status + "): " + t;
        logBotStorieConsole("❌ " + errStr, "error");
        try { alert(errStr); } catch(e){}
      });

function onCambioEpisodioBotReels(val) {
  var dataset = [];
  if (_botReelsCurrentMode === 'bibbia') dataset = _DB_STORIE_BIBLICHE;
  else if (_botReelsCurrentMode === 'standard') dataset = _DB_STORIE_GATTO;
  else if (_botReelsCurrentMode === 'pillole') dataset = _DB_PILLOLE_IMMOBILIARI;

  var item = null;
  if (val) {
    for (var i = 0; i < dataset.length; i++) {
      if (dataset[i].id === String(val)) {
        item = dataset[i];
        break;
      }
    }
  }

  var elTitolo = document.getElementById('bot-reels-preview-titolo');
  var elSotto = document.getElementById('bot-reels-preview-sottotitolo');
  var elTesto = document.getElementById('bot-reels-preview-testo');
  var elImg = document.getElementById('bot-reels-preview-img');

  if (item) {
    if (elTitolo) elTitolo.textContent = item.titolo;
    if (elSotto) {
      if (_botReelsCurrentMode === 'bibbia') {
        elSotto.textContent = item.riferimento + " • Canale «Eterno Nostra Giustizia»";
      } else if (_botReelsCurrentMode === 'standard') {
        elSotto.textContent = "di " + item.autore + " (" + item.anno + ") • " + item.genere;
      } else {
        elSotto.textContent = item.riferimento + " • " + item.genere;
      }
    }
    if (elTesto) elTesto.textContent = '"' + item.testo_f + '"';
    if (elImg && item.img) elImg.src = item.img;
  } else {
    if (elTitolo) elTitolo.textContent = "Estrazione Casuale Automatica";
    if (elSotto) elSotto.textContent = "Rotazione casuale dal database attivo (" + _botReelsCurrentMode.toUpperCase() + ")";
    if (elTesto) elTesto.textContent = '"Il bot selezionerà un episodio casuale prelevando i testi rigorosamente dalla Colonna F con garanzia di personal branding Immobiliare Giancani."';
  }
}
