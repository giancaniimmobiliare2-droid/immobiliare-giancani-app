  // 💬 LIVE CHAT TEST & DARIA SIMULATOR
  function testaRispostaAIDarIAUI() {
    var autore = document.getElementById('test-chat-autore').value.trim() || 'Spettatore Live';
    var msg = document.getElementById('test-chat-msg').value.trim();
    if (!msg) { alert("Inserisci un commento di prova."); return; }

    var outBox = document.getElementById('test-chat-output-box');
    var outText = document.getElementById('test-chat-risposta-text');
    if (outBox) outBox.style.display = 'block';
    if (outText) outText.innerHTML = '⏳ <em>DarIA sta elaborando la risposta con il pool Groq AI...</em>';

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success && res.risposta) {
          if (outText) outText.innerHTML = '<strong>' + autore + ':</strong> "' + msg + '"<br><br><strong>🎙️ DarIA:</strong> "' + res.risposta + '"';
          if (res.audioUrl) {
            try {
              var snd = new Audio(res.audioUrl);
              snd.play().catch(function(e) {});
            } catch(eAudio) {}
          }
        } else {
          if (outText) outText.innerHTML = '⚠️ Risposta: ' + (res && res.error ? res.error : 'Nessuna risposta generata.');
        }
      })
      .withFailureHandler(function(err) {
        if (outText) outText.innerHTML = '❌ Errore chiamata IA: ' + err.toString();
      })
      .generaRispostaAIDarIA(msg, autore, 'Facebook Live');
  }

function caricaTempiRegiaUI() {
    google.script.run.withSuccessHandler(function(res) {
      if (res && res.success && res.tempi) {
        var t = res.tempi;
        if (document.getElementById('cfg-durata-foto') && t.durataFotoSec) document.getElementById('cfg-durata-foto').value = t.durataFotoSec;
        if (document.getElementById('cfg-freq-yt') && t.freqYouTubeMin) document.getElementById('cfg-freq-yt').value = t.freqYouTubeMin;
        if (document.getElementById('cfg-freq-pubb') && t.freqPubblicitaMin) document.getElementById('cfg-freq-pubb').value = t.freqPubblicitaMin;
        if (document.getElementById('cfg-freq-meteo') && t.freqMeteoMin) document.getElementById('cfg-freq-meteo').value = t.freqMeteoMin;
        if (document.getElementById('cfg-freq-notizie') && t.freqNotizieMin) document.getElementById('cfg-freq-notizie').value = t.freqNotizieMin;
        if (document.getElementById('cfg-freq-teatrino') && t.freqTeatrinoMin) document.getElementById('cfg-freq-teatrino').value = t.freqTeatrinoMin;
      }
    }).getConfigurazioneTempiRegia();
  }

  function salvaTempiRegiaUI() {
    var payload = {
      durataFotoSec: parseFloat(document.getElementById('cfg-durata-foto').value) || 12,
      freqYouTubeMin: parseFloat(document.getElementById('cfg-freq-yt').value) || 5,
      freqPubblicitaMin: parseFloat(document.getElementById('cfg-freq-pubb').value) || 10,
      freqMeteoMin: parseFloat(document.getElementById('cfg-freq-meteo').value) || 15,
      freqNotizieMin: parseFloat(document.getElementById('cfg-freq-notizie').value) || 10,
      freqTeatrinoMin: parseFloat(document.getElementById('cfg-freq-teatrino').value) || 5
    };
    var st = document.getElementById('tempi-status-msg');
    google.script.run.withSuccessHandler(function(res) {
      if (st) {
        st.style.display = 'block';
        st.innerText = '✅ ' + (res && res.messaggio ? res.messaggio : 'Tempi salvati nel foglio!');
        setTimeout(function() { st.style.display = 'none'; }, 4000);
      }
    }).salvaConfigurazioneTempiRegia(payload);
  }

  // 🎭 CONTROLLO MODALITÀ AVATAR (DarIA & DarIO)
  function aggiornaStatoUIAvatar(mode) {
    var badges = document.querySelectorAll('.quick-badge-avatar, #quick-badge-avatar');
    var btnsOn = document.querySelectorAll('.quick-btn-avatar-on, #quick-btn-avatar-on');
    var btnsOff = document.querySelectorAll('.quick-btn-avatar-off, #quick-btn-avatar-off');

    badges.forEach(function(b) {
      if (mode === 'CON_AVATAR') {
        b.className = 'badge-status-on quick-badge-avatar';
        b.innerText = '🟢 AVATAR ATTIVI IN ONDA';
      } else {
        b.className = 'badge-status-off quick-badge-avatar';
        b.innerText = '⚪ VUOTO (SENZA AVATAR)';
      }
    });

    btnsOn.forEach(function(b) {
      if (mode === 'CON_AVATAR') {
        b.style.opacity = '1';
        b.style.outline = '2px solid #ffffff';
      } else {
        b.style.opacity = '0.6';
        b.style.outline = 'none';
      }
    });

    btnsOff.forEach(function(b) {
      if (mode === 'CON_AVATAR') {
        b.style.opacity = '0.6';
        b.style.outline = 'none';
      } else {
        b.style.opacity = '1';
        b.style.outline = '2px solid #ffffff';
      }
    });
  }

  function selezionaModalitaAvatar(mode) {
    aggiornaStatoUIAvatar(mode);

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          console.log('Modalità Avatar aggiornata:', res ? res.message : mode);
        })
        .withFailureHandler(function(err) {
          alert('⚠️ Errore salvataggio modalità: ' + (err && err.message ? err.message : err));
        })
        .impostaModalitaAvatar(mode);
    }
  }

  function caricaModalitaAvatarUI() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.mode) {
            aggiornaStatoUIAvatar(res.mode);
          }
        })
        .getModalitaAvatar();
    }
  }

  // 📐 GESTIONE POSIZIONE GRAFICA SET AVATAR (SINISTRA, CENTRO, DESTRA)
  function aggiornaUIPosizioneAvatar(pos) {
    var p = String(pos || 'destra').toLowerCase().trim();
    if (['sinistra', 'centro', 'destra'].indexOf(p) === -1) p = 'destra';
    var btns = {
      'sinistra': document.getElementById('btn-pos-sinistra'),
      'centro': document.getElementById('btn-pos-centro'),
      'destra': document.getElementById('btn-pos-destra')
    };
    Object.keys(btns).forEach(function(k) {
      var btn = btns[k];
      if (!btn) return;
      if (k === p) {
        btn.classList.add('active');
        btn.style.background = 'linear-gradient(135deg, var(--gold), var(--gold-dark))';
        btn.style.border = '1px solid var(--gold-bright)';
        btn.style.color = '#120c04';
        btn.style.padding = '8px 18px';
      } else {
        btn.classList.remove('active');
        btn.style.background = 'rgba(255,255,255,0.06)';
        btn.style.border = '1px solid var(--line-soft)';
        btn.style.color = 'var(--ivory)';
        btn.style.padding = '8px 16px';
      }
    });
  }

  function selezionaPosizioneSetAvatar(pos) {
    var p = String(pos || 'destra').toLowerCase().trim();
    if (['sinistra', 'centro', 'destra'].indexOf(p) === -1) p = 'destra';
    aggiornaUIPosizioneAvatar(p);

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (typeof mostraNotificaGen === 'function') {
            mostraNotificaGen('📐 Posizione Avatar impostata: ' + p.toUpperCase() + ' — Immobiliare Giancani', 'success');
          }
        })
        .withFailureHandler(function(err) {
          console.error('Errore pos avatar:', err);
        })
        .salvaPosizioneSetAvatar(p);
    } else if (typeof SCRIPT_URL !== 'undefined') {
      fetch(SCRIPT_URL + '?action=salva_posizione_avatar&posizione=' + encodeURIComponent(p))
        .then(function(r){ return r.json(); })
        .then(function(res){
          if (typeof mostraNotificaGen === 'function') {
            mostraNotificaGen('📐 Posizione Avatar impostata: ' + p.toUpperCase() + ' — Immobiliare Giancani', 'success');
          }
        })
        .catch(function(e){ console.error(e); });
    }
  }

  function caricaPosizioneSetAvatarUI() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.posizione) {
            aggiornaUIPosizioneAvatar(res.posizione);

        .then(function(res){
          if (res && res.posizione) aggiornaUIPosizioneAvatar(res.posizione);
        })
        .catch(function(e){});
    }
  }

  // ═══════════════════════════════════════════════════════════════════════
  // ⏮️⏭️ NAVIGAZIONE MANUALE CAROSELLO (AVANTI / INDIETRO)
  // ═══════════════════════════════════════════════════════════════════════
  function navigaCarosello(direzione) {
    var btnPrev = document.getElementById('btn-carosello-prev');
    var btnNext = document.getElementById('btn-carosello-next');
    var label   = document.getElementById('label-carosello-index');
    
    // Feedback visivo: blocca pulsanti durante navigazione
    if (btnPrev) btnPrev.disabled = true;
    if (btnNext) btnNext.disabled = true;
    if (label)  label.textContent = '⏳';

    google.script.run
      .withSuccessHandler(function(data) {
        if (!data) { 
          if (btnPrev) btnPrev.disabled = false;
          if (btnNext) btnNext.disabled = false;
          if (label)  label.textContent = '–/–';
          return; 
        }
        // Aggiorna il counter nel label
        var tot = data.totaleMedia || '?';
        var idx = (data.indiceCorrente !== undefined) ? (data.indiceCorrente + 1) : '?';
        if (label) label.textContent = idx + '/' + tot;
        
        // Aggiorna titolo video corrente nel pannello se presente
        var titolEl = document.getElementById('info-carosello-titolo');
        if (titolEl && data.titolo) titolEl.textContent = data.titolo;

        // Sblocca pulsanti
        if (btnPrev) btnPrev.disabled = false;
        if (btnNext) btnNext.disabled = false;

        // Mostra notifica breve
        mostraNotificaGen('⏭️ Video: ' + (data.titolo || 'N/D') + ' — Immobiliare Giancani', 'success');
      })
      .withFailureHandler(function(err) {
        console.error('navigaCarosello error:', err);
        if (btnPrev) btnPrev.disabled = false;
        if (btnNext) btnNext.disabled = false;
        if (label)  label.textContent = '–/–';
        mostraNotificaGen('⚠️ Errore navigazione carosello', 'error');
      })
      .getCaroselloPostYouTube(direzione);
  }

  function salvaTikTokKey() {
    var input = document.getElementById('input-tiktok-stream-key');
    if (!input || !input.value.trim()) {
      mostraNotificaGen('⚠️ Inserire una chiave stream TikTok valida', 'warning');
      return;
    }
    var key = input.value.trim();
    var btn = document.getElementById('btn-salva-tiktok');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Salvataggio...'; }
    
    google.script.run
      .withSuccessHandler(function(r) {
        if (btn) { btn.disabled = false; btn.textContent = '💾 Salva Chiave'; }
        if (r && r.success) {
          mostraNotificaGen('✅ TikTok LIVE configurato! La chiave sarà usata al prossimo avvio diretta — Immobiliare Giancani', 'success');
          var statoEl = document.getElementById('stato-tiktok');
          if (statoEl) { statoEl.textContent = '✅ Attivo'; statoEl.style.color = '#2ecc71'; }
        } else {
          mostraNotificaGen('❌ Errore: ' + (r && r.error ? r.error : 'Sconosciuto'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = '💾 Salva Chiave'; }
        mostraNotificaGen('❌ Errore TikTok: ' + err, 'error');
      })
      .salvaConfigurazioneTikTokLive(key);
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 🎭 SELETTORE LIVE COPPIA CONDUTTORI AVATAR IN ONDA & MODALITÀ CONDUZIONE
  // ═══════════════════════════════════════════════════════════════════════
  var currentCoppiaAvatarRegia = {
    donna: 'daria_bionda',
    uomo: 'antonio_giancani',
    modalita: 'solo_antonio',
    primario: 'antonio_giancani'
  };

  function impostaModalitaConduzioneUI(mode, skipServer) {
    if (!mode) mode = 'solo_antonio';
    currentCoppiaAvatarRegia.modalita = mode;

    if (mode === 'solo_antonio' || mode === 'antonio_primo') {
      currentCoppiaAvatarRegia.uomo = 'antonio_giancani';
      currentCoppiaAvatarRegia.primario = 'antonio_giancani';
    } else if (mode === 'solo_daria') {
      currentCoppiaAvatarRegia.primario = currentCoppiaAvatarRegia.donna || 'daria_bionda';
    } else {
      currentCoppiaAvatarRegia.primario = currentCoppiaAvatarRegia.donna || 'daria_bionda';
    }

    // 1. Aggiorna stile schede modalità conduzione
    var modes = ['solo_antonio', 'antonio_primo', 'solo_daria', 'coppia'];
    modes.forEach(function(m) {
      var card = document.getElementById('card-mode-' + m.replace('_', '-'));
      var btnLbl = document.getElementById('btn-label-' + m.replace('_', '-'));
      var isCur = (m === mode);
      if (card) {
        if (isCur) {
          card.style.background = 'linear-gradient(135deg, rgba(201,163,94,0.22), rgba(25,20,15,0.98))';
          card.style.border = '2.5px solid var(--gold-bright)';
          card.style.boxShadow = '0 0 24px rgba(201,163,94,0.5), inset 0 0 12px rgba(201,163,94,0.15)';
        } else {
          card.style.background = 'rgba(14,10,6,0.7)';
          card.style.border = '1.5px solid rgba(201,163,94,0.3)';
          card.style.boxShadow = 'none';
        }
      }
      if (btnLbl) {
        if (isCur) {
          btnLbl.style.background = 'linear-gradient(135deg, #10b981, #059669)';
          btnLbl.style.color = '#fff';
          btnLbl.style.border = 'none';
          btnLbl.textContent = '✅ ATTUALMENTE IN ONDA';
        } else {
          btnLbl.style.background = 'rgba(255,255,255,0.06)';
          btnLbl.style.color = 'var(--sand)';
          btnLbl.style.border = '1px solid var(--line-soft)';
          if (m === 'solo_antonio') btnLbl.textContent = '👑 Imposta Conduttore Unico';
          else if (m === 'antonio_primo') btnLbl.textContent = 'Metti Antonio 1° Posto';
          else if (m === 'solo_daria') btnLbl.textContent = 'Imposta Sola DarIA';
          else btnLbl.textContent = 'Imposta Coppia Standard';
        }
      }
    });

    // 2. Aggiorna Banner e Griglia Roster
    renderizzaRosterAvatarUI();

    // 3. Salva in localStorage locale
    try {
      localStorage.setItem('GIANCANI_COPPIA_AVATAR', JSON.stringify(currentCoppiaAvatarRegia));
      localStorage.setItem('GIANCANI_MODALITA_CONDUZIONE', mode);
    } catch(eLS) {}

    // 4. Mostra feedback visivo immediato
    var ind = document.getElementById('coppia-save-indicator');
    if (ind) {
      ind.style.display = 'inline-block';
      ind.textContent = '⚡ Invio in Diretta...';
      ind.style.color = '#2ecc71';
    }

    // 5. Broadcast immediato sub-millisecondo alla finestra della diretta
    try {
      var bc = new BroadcastChannel('giancani_live_channel');
      bc.postMessage({ type: 'CAMBIO_AVATAR', coppia: currentCoppiaAvatarRegia });
    } catch(eBC) {}

    // 6. Salvataggio su Google Apps Script PropertiesService
    if (!skipServer && typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (ind) {
            ind.textContent = '✨ ' + (mode === 'solo_antonio' ? 'Antonio Unico Conduttore!' : 'In Onda Ora!');
            setTimeout(function(){ ind.style.display = 'none'; }, 3500);
          }
        })
        .withFailureHandler(function(err) {
          if (ind) {
            ind.textContent = '⚠️ Errore salvataggio';
            ind.style.color = '#ef4444';
          }
        })
        .impostaAvatarInOnda(currentCoppiaAvatarRegia.donna, currentCoppiaAvatarRegia.uomo, currentCoppiaAvatarRegia.modalita, currentCoppiaAvatarRegia.primario);
    }
  }

  function renderizzaRosterAvatarUI() {

  function selezionaAvatarInOnda(ruolo, id) {
    if (ruolo === 'donna') {
      currentCoppiaAvatarRegia.donna = id;
      if (currentCoppiaAvatarRegia.modalita === 'solo_antonio') {
        // Se era in solo_antonio e clicca una donna, passa alla coppia con Antonio primo
        currentCoppiaAvatarRegia.modalita = 'antonio_primo';
      }
    } else if (ruolo === 'uomo') {
      currentCoppiaAvatarRegia.uomo = id;
      if (currentCoppiaAvatarRegia.modalita === 'solo_daria') {
        currentCoppiaAvatarRegia.modalita = 'coppia';
      }
    }

    // Aggiorna UI all'istante
    renderizzaRosterAvatarUI();

    // Mostra feedback visivo immediato
    var ind = document.getElementById('coppia-save-indicator');
    if (ind) {
      ind.style.display = 'inline-block';
      ind.textContent = '⚡ Invio in Diretta...';
      ind.style.color = '#2ecc71';
    }

    // Broadcast locale immediato se la diretta è aperta nello stesso browser
    try {
      var bc = new BroadcastChannel('giancani_live_channel');
      bc.postMessage({ type: 'CAMBIO_AVATAR', coppia: currentCoppiaAvatarRegia });
    } catch(eBC) {}

    // Chiamata server Apps Script
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (ind) {
            ind.textContent = '✨ In Onda Ora!';
            setTimeout(function(){ ind.style.display = 'none'; }, 3500);
          }
        })
        .withFailureHandler(function(err) {
          if (ind) {
            ind.textContent = '⚠️ Errore salvataggio';
            ind.style.color = '#ef4444';
          }
        })
        .impostaAvatarInOnda(currentCoppiaAvatarRegia.donna, currentCoppiaAvatarRegia.uomo, currentCoppiaAvatarRegia.modalita, currentCoppiaAvatarRegia.primario);
    }
  }

  function caricaCoppiaAvatarUI() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && (res.donna || res.uomo || res.modalita)) {
            currentCoppiaAvatarRegia.donna = res.donna || currentCoppiaAvatarRegia.donna;
            currentCoppiaAvatarRegia.uomo = res.uomo || currentCoppiaAvatarRegia.uomo;
            currentCoppiaAvatarRegia.modalita = res.modalita || currentCoppiaAvatarRegia.modalita;
            currentCoppiaAvatarRegia.primario = res.primario || currentCoppiaAvatarRegia.primario;
          } else if (res && res.coppia) {
            currentCoppiaAvatarRegia = Object.assign(currentCoppiaAvatarRegia, res.coppia);
          }
          impostaModalitaConduzioneUI(currentCoppiaAvatarRegia.modalita, true);
        })
        .withFailureHandler(function() {
          impostaModalitaConduzioneUI(currentCoppiaAvatarRegia.modalita, true);
        })
        .getCoppiaAvatarAttiva();
    } else {
      impostaModalitaConduzioneUI(currentCoppiaAvatarRegia.modalita, true);
    }
  }

  function renderizzaFeedCommentiLiveUI(commenti) {
    var container = document.getElementById('elenco-commenti-live-feed');
    var badge = document.getElementById('badge-commenti-count');
    if (!container) return;

    if (!commenti || commenti.length === 0) {
      if (badge) badge.textContent = '0 commenti';
      container.innerHTML = '<div style="text-align:center; color:var(--sand-dim); font-size:12px; padding:16px;">' +
        'Nessun commento recente ricevuto. Quando un utente commenta su Facebook, Instagram, YouTube o in chat, il messaggio apparirà qui all\'istante e gli avatar risponderanno a voce in diretta!' +
        '</div>';
      return;
    }

    if (badge) badge.textContent = commenti.length + (commenti.length === 1 ? ' commento' : ' commenti');

    var html = '';
    commenti.forEach(function(c) {
      var platBadge = c.piattaforma === 'Facebook' ? '<span style="background:#1877f2; color:white; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">📘 Facebook</span>' :
                      c.piattaforma === 'Instagram' ? '<span style="background:linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color:white; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">📸 Instagram</span>' :
                      c.piattaforma === 'YouTube' ? '<span style="background:#ff0000; color:white; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">🔴 YouTube</span>' :
                      '<span style="background:#2ecc71; color:white; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold;">💬 Web Chat</span>';

      var orario = c.timestamp ? new Date(c.timestamp).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';

      html += '<div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:10px;">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">' +
          '<div style="display:flex; align-items:center; gap:8px;">' +
            platBadge +
            '<strong style="color:var(--gold-bright); font-size:12px;">' + (c.autore || 'Spettatore') + '</strong>' +
            (c.stanza ? '<span style="font-size:10px; color:#3498db; background:rgba(52,152,219,0.15); padding:2px 6px; border-radius:4px;">📍 Stanza: ' + c.stanza.toUpperCase() + '</span>' : '') +
          '</div>' +
          '<span style="font-size:10px; color:var(--sand-dim);">' + orario + '</span>' +
        '</div>' +
        '<div style="font-size:12px; color:white; margin-bottom:6px;"><b>Domanda:</b> <i>"' + (c.messaggio || '') + '"</i></div>' +
        '<div style="background:rgba(0,0,0,0.3); border-left:3px solid var(--gold); padding:6px 10px; border-radius:4px; font-size:11.5px; color:var(--sand);">' +
          '<div style="margin-bottom:2px;"><b style="color:#e67e22;">🎙️ DarIA:</b> ' + (c.dariaTxt || '') + '</div>' +
          '<div><b style="color:#3498db;">💻 DarIO:</b> ' + (c.darioTxt || '') + '</div>' +
        '</div>' +
      '</div>';
    });

    container.innerHTML = html;
  }

  function pollaCommentiDirettaUI(btn) {
    var oldTxt = btn ? btn.innerHTML : '';
    if (btn) { btn.innerHTML = '⏳ Controllo...'; btn.disabled = true; }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (btn) { btn.innerHTML = oldTxt; btn.disabled = false; }
          if (res && res.success) {
            caricaStoricoCommentiLiveUI();
            var n = res.nuoviCommentiCount || (res.nuoviCommenti ? res.nuoviCommenti.length : 0);
            mostraNotificaRegia('Commenti Social: ' + n + ' nuovi commenti rilevati!', 'success');
          } else {
            mostraNotificaRegia('Errore polling commenti: ' + (res ? res.error : 'sconosciuto'), 'warning');
          }
        })
        .withFailureHandler(function(err) {
          if (btn) { btn.innerHTML = oldTxt; btn.disabled = false; }
          mostraNotificaRegia('Errore: ' + err, 'error');
        })
        .pollaCommentiDiretta();
    }
  }

                (res.risposta && res.risposta.stanza ? '<div style="margin-top:4px; color:#3498db;">📍 <i>Navigazione automatica alla stanza: ' + res.risposta.stanza.toUpperCase() + '</i></div>' : '');
            }
            mostraNotificaRegia('Domanda mandata in diretta con successo!', 'success');
            caricaStoricoCommentiLiveUI();
          } else {
            if (resBox) {
              resBox.style.display = 'block';
              resBox.style.borderColor = '#e74c3c';
              resBox.style.background = 'rgba(231,76,60,0.15)';
              resBox.innerHTML = '<span style="color:#e74c3c;">⚠️ Errore invio: ' + (res ? res.error : 'sconosciuto') + '</span>';
            }
          }
        })
        .withFailureHandler(function(err) {
          if (btn) { btn.innerHTML = oldTxt; btn.disabled = false; }
          if (resBox) {
            resBox.style.display = 'block';
            resBox.style.borderColor = '#e74c3c';
            resBox.innerHTML = '<span style="color:#e74c3c;">⚠️ Errore connessione: ' + err + '</span>';
          }
        })
        .elaboraCommentoEsternoDiretto(testo, autore, plat);
    }
  }


</script>
