      function inserisciStanzaSmart(inputId, nomeStanza, subContainerId) {
        var el = document.getElementById(inputId);
        if (!el) return;
        var tabN = typeof _galleriaTabCorrente !== 'undefined' ? _galleriaTabCorrente : '';
        var fallbackTipo = typeof estraiTipoImmobileDaNomeCartella === 'function' ? estraiTipoImmobileDaNomeCartella(tabN) : 'Ambiente';
        var currentVal = el.value.trim();

        // Se vuoto o valore generico tipo "Ambiente" o "Appartamento"
        var isDefault = !currentVal ||
                        currentVal.toLowerCase() === 'ambiente' ||
                        currentVal.toLowerCase().indexOf('ambiente ') === 0 ||
                        (fallbackTipo && currentVal.toLowerCase() === fallbackTipo.toLowerCase());

        if (isDefault) {
          el.value = nomeStanza + ' ';
        } else {
          // L'utente clicca una stanza per iniziare la definizione (es. Bagno -> poi digita lavabo bidè e wc)
          el.value = nomeStanza + ' ';
        }

        el.focus();
        var len = el.value.length;
        if (typeof el.setSelectionRange === 'function') {
          el.setSelectionRange(len, len);
        }

        if (subContainerId) {
          mostraSottoDettagliSmart(inputId, nomeStanza, subContainerId);
        }
      }

      function aggiungiParticolareStanza(inputId, particolare) {
        var el = document.getElementById(inputId);
        if (!el) return;
        var val = el.value.trim();
        if (val.toLowerCase().indexOf(particolare.toLowerCase()) === -1) {
          el.value = val ? (val + ' ' + particolare + ' ') : (particolare + ' ');
        } else {
          el.value = val + ' ';
        }
        el.focus();
        var len = el.value.length;
        if (typeof el.setSelectionRange === 'function') {
          el.setSelectionRange(len, len);
        }
      }

      function mostraSottoDettagliSmart(inputId, nomeStanza, subContainerId) {
        var subBox = document.getElementById(subContainerId);
        if (!subBox) return;

        var k = (nomeStanza || '').toLowerCase();
        var list = null;

        for (var key in SMART_STANZE_CONFIG.particolariPerStanza) {
          if (k.indexOf(key) !== -1) {
            list = SMART_STANZE_CONFIG.particolariPerStanza[key];
            break;
          }
        }

        if (!list) {
          list = [
            'luminoso e accogliente',
            'ristrutturato di recente',
            'con finiture moderne',
            'con vista aperta',
            'climatizzato'
          ];
        }

        var html = '<span style="font-size:10px; color:#2ecc71; font-weight:700; margin-right:4px; flex-shrink:0;">✨ Particolari:</span>';
        for (var i = 0; i < list.length; i++) {
          var d = list[i];
          html += '<button type="button" class="smart-subchip" onclick="aggiungiParticolareStanza(\'' + inputId + '\', \'' + d.replace(/'/g, "\\'") + '\')" title="Aggiungi: ' + d + '">+ ' + d + '</button>';
        }
        subBox.innerHTML = html;
        subBox.style.display = 'flex';
      }

      function chiudiCatalogoCompletoStanze() {
        var modal = document.getElementById('modal-smart-stanze-catalogo');
        if (modal) modal.style.display = 'none';
        if (_activeSmartTargetInputId) {
          var el = document.getElementById(_activeSmartTargetInputId);
          if (el) {
            el.focus();
            var len = el.value.length;
            if (typeof el.setSelectionRange === 'function') el.setSelectionRange(len, len);

      function renderCatalogoStanzeFiltro(term) {
        var container = document.getElementById('smart-stanze-catalog-body');
        if (!container) return;

        var q = (term || '').trim().toLowerCase();
        var html = '';
        var totalFound = 0;

        for (var catName in SMART_STANZE_CONFIG.categorie) {
          var items = SMART_STANZE_CONFIG.categorie[catName];
          var matching = items.filter(function(it) {
            if (!q) return true;
            return it.n.toLowerCase().indexOf(q) !== -1 || catName.toLowerCase().indexOf(q) !== -1;
          });

          if (matching.length > 0) {
            totalFound += matching.length;
            html += '<div style="background:rgba(255,255,255,0.03); border:1px solid var(--line-soft); border-radius:10px; padding:10px 14px;">';
            html += '<div style="font-size:11.5px; font-weight:800; color:var(--gold); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.03em;">' + catName + '</div>';
            html += '<div style="display:flex; flex-wrap:wrap; gap:6px;">';
            for (var j = 0; j < matching.length; j++) {
              var st = matching[j];
              html += '<button type="button" class="smart-chip" onclick="selezionaStanzaDaCatalogo(\'' + st.n.replace(/'/g, "\\'") + '\')" style="font-size:11.5px; padding:5px 10px;" title="Seleziona ' + st.n + '">' + st.i + ' ' + st.n + '</button>';
            }
            html += '</div></div>';
          }
        }

        if (totalFound === 0) {
          html = '<div style="text-align:center; padding:24px; color:var(--sand);">'
               + '<div>Nessuna stanza predefinita trovata per "<strong>' + q + '</strong>"</div>'
               + '<div style="margin-top:10px;"><button type="button" class="btn-gold" onclick="selezionaStanzaDaCatalogo(\'' + q.replace(/'/g, "\\'") + '\')" style="padding:6px 14px; font-size:11px;">Usa comunque "' + q + '"</button></div>'
               + '</div>';
        }

        container.innerHTML = html;
      }

      function aggiornaVisualeZoomRegia(val) {
        _currentZoomVal = parseInt(val, 10) || 125;
        if (_currentZoomVal < 50) _currentZoomVal = 50;
        if (_currentZoomVal > 250) _currentZoomVal = 250;

        var slider = document.getElementById('zoom-regia-slider');
        if (slider) slider.value = _currentZoomVal;

        var disp = document.getElementById('zoom-regia-display');
        if (disp) {
          var label = _currentZoomVal + '%';
          if (_currentZoomVal === 50) label += ' (Panoramico)';
          else if (_currentZoomVal === 100) label += ' (Standard)';
          else if (_currentZoomVal === 125) label += ' (Consigliato ⭐)';
          else if (_currentZoomVal === 250) label += ' (Dettaglio Max)';
          disp.textContent = label;
        }

        var presetBtns = document.querySelectorAll('.btn-preset-zoom');
        presetBtns.forEach(function(b) {
          var bText = b.textContent.trim();
          if (bText.indexOf(_currentZoomVal + '%') !== -1) {
            b.style.background = 'linear-gradient(135deg, var(--gold), var(--gold-dark))';
            b.style.color = '#120c04';
            b.style.borderColor = 'var(--gold-bright)';
            b.style.fontWeight = '800';
          } else {
            b.style.background = 'rgba(255,255,255,0.06)';
            b.style.color = 'var(--ivory)';
            b.style.borderColor = 'var(--line-soft)';
            b.style.fontWeight = '700';
          }
        });
      }

      function impostaPresetZoom(val) {
        aggiornaVisualeZoomRegia(val);
        salvaZoomRegiaRemoto(val);
      }

      function incrementaZoomRegia(delta) {
        var n = (_currentZoomVal || 125) + delta;
        if (n < 50) n = 50;
        if (n > 250) n = 250;
        aggiornaVisualeZoomRegia(n);
        salvaZoomRegiaRemoto(n);
      }

      function salvaZoomRegiaRemoto(val) {
        var num = parseInt(val, 10) || 125;
        google.script.run
          .withSuccessHandler(function(res) {
            var ind = document.getElementById('zoom-save-indicator');
            if (ind) {
              ind.style.display = 'inline';
              setTimeout(function() { ind.style.display = 'none'; }, 3000);
            }
          })
          .salvaZoomDiretta(num);
      }

      var _availableVoices = [];
      var _lastSavedVoiceConfig = null;

      function popolaElencoVociRegia(savedCfg) {
        if (!('speechSynthesis' in window)) return;
        _availableVoices = window.speechSynthesis.getVoices() || [];
        if (!_availableVoices.length) return;

        if (savedCfg) {
          _lastSavedVoiceConfig = savedCfg;
        } else if (_lastSavedVoiceConfig) {
          savedCfg = _lastSavedVoiceConfig;
        }

        var selDaria = document.getElementById('select-voce-daria');
        var selDario = document.getElementById('select-voce-dario');
        var selDariaTab = document.getElementById('select-voce-daria-tab');
        var selDarioTab = document.getElementById('select-voce-dario-tab');

        var itVoices = _availableVoices.filter(function(v) {
          return v.lang && (v.lang.toLowerCase().indexOf('it') !== -1);
        });
        var voicePool = itVoices.length ? itVoices : _availableVoices;

        var curDariaVal = (savedCfg && savedCfg.voceDaria) ? savedCfg.voceDaria : (selDariaTab ? selDariaTab.value : (selDaria ? selDaria.value : ''));
        var curDarioVal = (savedCfg && savedCfg.voceDario) ? savedCfg.voceDario : (selDarioTab ? selDarioTab.value : (selDario ? selDario.value : ''));

        var pairs = [
          { d: selDaria, o: selDario },
          { d: selDariaTab, o: selDarioTab }
        ];

        pairs.forEach(function(pair) {
          if (pair.d) {
            pair.d.innerHTML = '<option value="">Auto (Consigliata: Elsa / Isabella / Alice)</option>';
            var foundDaria = false;
            voicePool.forEach(function(v) {
              var opt = document.createElement('option');
              opt.value = v.name;
              opt.textContent = v.name + ' (' + v.lang + (v.default ? ' - Predefinita' : '') + ')';
              if (curDariaVal && (v.name === curDariaVal || v.voiceURI === curDariaVal)) {
                opt.selected = true;
                foundDaria = true;
              }
              pair.d.appendChild(opt);
            });
            if (!foundDaria && curDariaVal) {
              var cLow = curDariaVal.toLowerCase();
              for (var i = 0; i < pair.d.options.length; i++) {
                var o = pair.d.options[i];
                if (o.value && (o.value.toLowerCase().indexOf(cLow) !== -1 || cLow.indexOf(o.value.toLowerCase()) !== -1)) {
                  o.selected = true;
                  break;
                }
              }
            }
          }
          if (pair.o) {
            pair.o.innerHTML = '<option value="">Auto (Consigliata: Diego / Cosimo / Giuseppe)</option>';
            var foundDario = false;
            voicePool.forEach(function(v) {
              var opt = document.createElement('option');
              opt.value = v.name;
              opt.textContent = v.name + ' (' + v.lang + (v.default ? ' - Predefinita' : '') + ')';
              if (curDarioVal && (v.name === curDarioVal || v.voiceURI === curDarioVal)) {
                opt.selected = true;
                foundDario = true;
              }
              pair.o.appendChild(opt);
            });
            if (!foundDario && curDarioVal) {
              var cLow2 = curDarioVal.toLowerCase();
              for (var j = 0; j < pair.o.options.length; j++) {
                var o2 = pair.o.options[j];
                if (o2.value && (o2.value.toLowerCase().indexOf(cLow2) !== -1 || cLow2.indexOf(o2.value.toLowerCase()) !== -1)) {
                  o2.selected = true;
                  break;
                }
              }
            }
          }
        });
      }

      function testVoceRegia(conduttore) {
        if (!('speechSynthesis' in window)) {
          alert("Sintesi vocale non supportata dal browser.");
          return;
        }
        window.speechSynthesis.cancel();

        var isDaria = (conduttore === 'daria');
        var sel = document.getElementById(isDaria ? 'select-voce-daria' : 'select-voce-dario');
        var pitchEl = document.getElementById(isDaria ? 'pitch-daria' : 'pitch-dario');
        var rateEl = document.getElementById(isDaria ? 'rate-daria' : 'rate-dario');

        var frase = isDaria
          ? "Ciao! Sono DarIA, la vostra guida in diretta per gli annunci immobiliari più prestigiosi. — Immobiliare Giancani"
          : "Ciao a tutti! Sono DarIO, pronto con le analisi di mercato e le battute più divertenti della diretta! — Immobiliare Giancani";

        var u = new SpeechSynthesisUtterance(frase);
        u.lang = 'it-IT';
        u.pitch = pitchEl ? parseFloat(pitchEl.value) : (isDaria ? 1.18 : 0.84);
        u.rate = rateEl ? parseFloat(rateEl.value) : (isDaria ? 1.02 : 0.98);

        if (sel && sel.value && _availableVoices.length) {
          var matched = _availableVoices.find(function(v) { return v.name === sel.value || v.voiceURI === sel.value; });
          if (matched) u.voice = matched;
        }

        window.speechSynthesis.speak(u);
      }

      function salvaConfigurazioneVociRegia() {
        var selDaria = document.getElementById('select-voce-daria');
        var selDario = document.getElementById('select-voce-dario');
        var pitchDaria = document.getElementById('pitch-daria');
        var pitchDario = document.getElementById('pitch-dario');
        var rateDaria = document.getElementById('rate-daria');
        var rateDario = document.getElementById('rate-dario');

        var cfg = {
          voceDaria: selDaria ? selDaria.value : '',
          voceDario: selDario ? selDario.value : '',
          pitchDaria: pitchDaria ? pitchDaria.value : '1.18',
          pitchDario: pitchDario ? pitchDario.value : '0.84',
          rateDaria: rateDaria ? rateDaria.value : '1.02',
          rateDario: rateDario ? rateDario.value : '0.98'
        };

        _lastSavedVoiceConfig = cfg;

        // Sincronizza tab avatar
        var selDariaTab = document.getElementById('select-voce-daria-tab');
        var selDarioTab = document.getElementById('select-voce-dario-tab');
        var pitchDariaTab = document.getElementById('pitch-daria-tab');
        var pitchDarioTab = document.getElementById('pitch-dario-tab');
        var rateDariaTab = document.getElementById('rate-daria-tab');
        var rateDarioTab = document.getElementById('rate-dario-tab');

        if (selDariaTab && selDaria) selDariaTab.value = selDaria.value;
        if (selDarioTab && selDario) selDarioTab.value = selDario.value;
        if (pitchDariaTab && pitchDaria) {
          pitchDariaTab.value = pitchDaria.value;
          var t1 = document.getElementById('pitch-daria-tab-val');
          if (t1) t1.textContent = pitchDaria.value;
        }
        if (pitchDarioTab && pitchDario) {
          pitchDarioTab.value = pitchDario.value;
          var t2 = document.getElementById('pitch-dario-tab-val');
          if (t2) t2.textContent = pitchDario.value;
        }
        if (rateDariaTab && rateDaria) {
          rateDariaTab.value = rateDaria.value;
          var t3 = document.getElementById('rate-daria-tab-val');
          if (t3) t3.textContent = rateDaria.value;
        }
        if (rateDarioTab && rateDario) {
          rateDarioTab.value = rateDario.value;
          var t4 = document.getElementById('rate-dario-tab-val');
          if (t4) t4.textContent = rateDario.value;
        }

        google.script.run
          .withSuccessHandler(function(res) {
            var ind = document.getElementById('voci-save-indicator');
            if (ind) {
              ind.style.display = 'inline';
              setTimeout(function() { ind.style.display = 'none'; }, 3000);
            }
            var indTab = document.getElementById('voci-tab-save-indicator');
            if (indTab) {
              indTab.style.display = 'inline';
              setTimeout(function() { indTab.style.display = 'none'; }, 3000);
            }
          })
          .salvaConfigurazioneVoci(cfg);
      }



/**
 * ⭐ Apertura diretta di uno studio dalla Prima Pagina Hero
 */
function apriStudioDaHero(tabId) {
  if (typeof mostraTab === 'function') {
    mostraTab(tabId);
  }
  var target = document.getElementById(tabId);
  if (target) {
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

</script>
