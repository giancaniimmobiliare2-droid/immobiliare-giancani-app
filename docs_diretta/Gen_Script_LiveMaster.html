      function aggiornaUISelettoreStile(stile, infoBackend) {
        var raw = String(stile || 'auto').toLowerCase().trim();
        var isAuto = (!raw || raw === 'auto' || raw === 'rotazione_oraria');
        var validi = ['modern_broadcast', 'editorial_minimal', 'tech_dark', 'comic_pop'];
        
        var labels = {
          'modern_broadcast': '📡 Modern Broadcast',
          'editorial_minimal': '🏛️ Editorial Minimal',
          'tech_dark': '⚡ Tech & Dark UI',
          'comic_pop': '💥 Fumetto Pop'
        };

        var curHour = new Date().getHours();
        var curMin = new Date().getMinutes();
        var minAlCambio = 60 - curMin;
        var stiliOrari = ['modern_broadcast', 'editorial_minimal', 'tech_dark', 'comic_pop'];
        var stileOrarioCalcolato = stiliOrari[curHour % stiliOrari.length];
        var stileEffettivo = isAuto ? stileOrarioCalcolato : raw;
        _stileGraficaSelezionato = isAuto ? 'auto' : raw;

        var b = document.getElementById('badge-stile-grafica-attivo');
        if (b) {
          b.innerText = isAuto ? ('🔄 ' + (labels[stileEffettivo] || stileEffettivo) + ' (Auto)') : (labels[stileEffettivo] || stileEffettivo);
          b.style.color = isAuto ? '#4ade80' : '#38bdf8';
          b.style.borderColor = isAuto ? 'rgba(74,222,128,0.4)' : 'rgba(56,189,248,0.3)';
          b.style.background = isAuto ? 'rgba(74,222,128,0.15)' : 'rgba(56,189,248,0.15)';
        }

        var btnAuto = document.getElementById('btn-stile-auto');
        var dotAuto = document.getElementById('dot-stile-auto');
        var lblAuto = document.getElementById('label-rotazione-oraria-dettaglio');
        if (btnAuto) {
          if (isAuto) {
            btnAuto.style.border = '2px solid #4ade80';
            btnAuto.style.boxShadow = '0 0 16px rgba(74,222,128,0.35)';
            btnAuto.style.opacity = '1';
            if (dotAuto) { dotAuto.style.background = '#4ade80'; dotAuto.style.boxShadow = '0 0 10px #4ade80'; }
            if (lblAuto) {
              var prox = stiliOrari[(curHour + 1) % stiliOrari.length];
              lblAuto.innerText = 'Ora ' + curHour + ':00 in onda: ' + labels[stileEffettivo] + ' • Prossimo cambio tra ' + minAlCambio + ' min (' + labels[prox] + ')';
            }
          } else {
            btnAuto.style.border = '1.5px solid #444';
            btnAuto.style.boxShadow = 'none';
            btnAuto.style.opacity = '0.7';
            if (dotAuto) { dotAuto.style.background = '#64748b'; dotAuto.style.boxShadow = 'none'; }
            if (lblAuto) { lblAuto.innerText = 'Rotazione disattivata: stile bloccato manualmente su ' + labels[stileEffettivo] + ' (clicca qui per riattivare rotazione oraria)'; }
          }
        }

        validi.forEach(function(item) {
          var btn = document.getElementById('btn-stile-' + item);
          if (btn) {
            if (!isAuto && item === raw) {
              btn.style.borderColor = (item === 'comic_pop' ? '#facc15' : (item === 'editorial_minimal' ? '#c26d53' : (item === 'tech_dark' ? '#7c3aed' : '#38bdf8')));
              btn.style.boxShadow = '0 0 14px rgba(56,189,248,0.6)';
              btn.style.opacity = '1';
              btn.classList.add('active');
            } else if (isAuto && item === stileEffettivo) {
              btn.style.borderColor = 'rgba(74,222,128,0.6)';
              btn.style.boxShadow = '0 0 8px rgba(74,222,128,0.25)';
              btn.style.opacity = '0.95';
              btn.classList.remove('active');
            } else {
              btn.style.borderColor = '#444';
              btn.style.boxShadow = 'none';
              btn.style.opacity = '0.65';
              btn.classList.remove('active');
            }
          }
        });
      }

      function selezionaStileGraficaDiretta(stile) {
        aggiornaUISelettoreStile(stile);

        try {
          if (window.BroadcastChannel) {
            var bc = new BroadcastChannel('giancani_live_channel');
            bc.postMessage({ type: 'CAMBIO_STILE_GRAFICA', stile: stile });
          }
        } catch(eBc){}

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run

              if (msgEl) {
                msgEl.style.color = '#4ade80';

                setTimeout(function() { msgEl.style.display = 'none'; }, 4000);

              if (res && res.info) {
                aggiornaUISelettoreStile(res.stile, res.info);
              }
              if (typeof mostraNotificaGen === 'function') {
                var txtNotif = (stile === 'auto')

                mostraNotificaGen(txtNotif, 'success');

            })
            .withFailureHandler(function(err) {
              if (msgEl) {
                msgEl.style.color = '#f87171';
                msgEl.innerText = '❌ Errore: ' + err;
              }
            })
            .salvaStileGraficaDiretta(stile);
        } else if (typeof SCRIPT_URL !== 'undefined') {
          fetch(SCRIPT_URL + '?action=salva_stile_grafica&stile=' + encodeURIComponent(stile))

                msgEl.style.color = '#4ade80';

                setTimeout(function() { msgEl.style.display = 'none'; }, 4000);
              }
              if (res && res.info) {
                aggiornaUISelettoreStile(res.stile, res.info);
              }
            })
            .catch(function(e){
              if (msgEl) {
                msgEl.style.color = '#f87171';
                msgEl.innerText = '⚠️ Errore rete: ' + e;
              }
            });
        }
      }

      function salvaParametriQualitaMaster() {
        var qSel = document.getElementById('select-qualita-live-master') || document.getElementById('gen-stream-quality');

        var qualita = qSel ? qSel.value : '1080p_std';
        var scale = sSel ? sSel.value : '1.0';

        var customBox = document.getElementById('box-qualita-custom-master');
        var customB = document.getElementById('input-custom-bitrate');
        var customR = document.getElementById('input-custom-res');
        var cBitrate = customB ? customB.value.trim() : '';
        var cRes = customR ? customR.value.trim() : '';

        if (customBox) {
          customBox.style.display = (qualita === 'custom') ? 'grid' : 'none';
        }

        var tabQ = document.getElementById('gen-stream-quality');
        var tabS = document.getElementById('gen-stream-scale');
        if (tabQ && tabQ !== qSel) tabQ.value = qualita;
        if (tabS && tabS !== sSel) tabS.value = scale;

        // Se la diretta è già attiva, mostra il pulsante per applicare subito la nuova configurazione
        var btnRiavvia = document.getElementById('btn-master-riavvia-qualita');
        if (btnRiavvia && typeof isMultistreamRunningGen !== 'undefined' && isMultistreamRunningGen) {
          btnRiavvia.style.display = 'inline-flex';
        }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function() {
              var badge = document.getElementById('badge-ffmpeg-quality');
              if (badge) {
                var qLabel = (qualita === '1080p_high') ? 'Ultra HD 1080p (6000k)' :
                             (qualita === '1080p_std')  ? 'Full HD 1080p (4500k)' :
                             (qualita === '1080p_eco')  ? 'Full HD 1080p Eco (3500k)' :
                             (qualita === '720p_hq')    ? 'HD 720p HQ (3000k)' :
                             (qualita === '720p_std')   ? 'HD 720p Standard (2200k)' :
                             (qualita === '720p_eco')   ? 'HD 720p Eco (1600k)' :
                             (qualita === '480p')       ? 'SD 480p (1000k)' : 'Custom (' + (cBitrate || '4000k') + ')';
                badge.innerText = qLabel + ' • Scala ' + scale;
              }
            })
            .salvaQualitaStreamingFFmpeg(qualita, scale, 'none', cBitrate, cRes);
        }
      }

      /**
       * Apre la finestra modale di modifica dati immobile, popolando il selettore
       * e precaricando i dati dell'immobile specificato o correntemente attivo.
       */
      function apriModalModificaImmobile(tabName) {
        var modal = document.getElementById('modal-modifica-immobile');
        if (!modal) return;

        var selModal = document.getElementById('mod-immobile-select');
        var statusEl = document.getElementById('mod-immobile-status');
        if (statusEl) statusEl.style.display = 'none';

        // 1. Popola la tendina immobili se vuota o per aggiornarla
        if (selModal) {
          selModal.innerHTML = '';
          var itemsKeys = Object.keys(_immobiliFullDataMap || {});
          
          if (itemsKeys.length > 0) {
            itemsKeys.forEach(function(k) {
              var it = _immobiliFullDataMap[k];
              var opt = document.createElement('option');
              opt.value = k;
              var labelTxt = (it && it.nome) ? it.nome : k.replace(/_/g, ' ');
              if (it && it.prezzo) labelTxt += ' (' + it.prezzo + ')';
              opt.innerText = '🏠 ' + labelTxt;
              selModal.appendChild(opt);
            });
          } else {
            // Fallback se la mappa non è ancora pronta
            var selectLive = document.getElementById('select-immobile-live');
            if (selectLive && selectLive.options.length > 0) {
              for (var i = 0; i < selectLive.options.length; i++) {
                var o = selectLive.options[i];
                if (o.value && o.value !== 'tutti') {
                  var opt2 = document.createElement('option');
                  opt2.value = o.value;
                  opt2.innerText = o.innerText;
                  selModal.appendChild(opt2);
                }
              }
            }
          }
        }

        // 2. Determina quale immobile pre-selezionare
        var targetTab = tabName;
        if (!targetTab || targetTab === 'tutti') {
          var selLive = document.getElementById('select-immobile-live');
          if (selLive && selLive.value && selLive.value !== 'tutti') {
            targetTab = selLive.value;
          } else if (selModal && selModal.options.length > 0) {
            targetTab = selModal.options[0].value;
          }
        }

        if (selModal && targetTab) {
          selModal.value = targetTab;
        }

        // 3. Carica i dati dell'immobile nei campi di input
        caricaDatiImmobileNelModale(targetTab);

        // 4. Mostra il modale con animazione fluida
        modal.style.display = 'flex';
      }

      /**
       * Chiude la finestra modale di modifica dati immobile.
       */
      function chiudiModalModificaImmobile() {
        var modal = document.getElementById('modal-modifica-immobile');

      /**
       * Carica i valori dell'immobile selezionato nei campi del modale.
       */
      function caricaDatiImmobileNelModale(tabName) {
        if (!tabName) return;
        var item = (_immobiliFullDataMap && _immobiliFullDataMap[tabName]) ? _immobiliFullDataMap[tabName] : null;

        var prezzoInp = document.getElementById('mod-immobile-prezzo');
        var mqInp = document.getElementById('mod-immobile-mq');
        var zonaInp = document.getElementById('mod-immobile-zona');
        var testoFInp = document.getElementById('mod-immobile-testo-f');
        var statusEl = document.getElementById('mod-immobile-status');
        if (statusEl) statusEl.style.display = 'none';

        if (item) {
          if (prezzoInp) {
            var rawP = (item.prezzo || '').replace(/^[€\s]+/, '').trim();
            prezzoInp.value = rawP;
          }
          if (mqInp) mqInp.value = item.mq || '';
          if (zonaInp) zonaInp.value = item.zona || '';
          if (testoFInp) testoFInp.value = item.testoColonnaF || '';
        } else {
          if (prezzoInp) prezzoInp.value = '';
          if (mqInp) mqInp.value = '';
          if (zonaInp) zonaInp.value = '';
          if (testoFInp) testoFInp.value = '';
        }
      }

      /**
       * Salva le modifiche inserite dall'utente su Google Sheets (Colonne B, C, F, H)
       * e aggiorna istantaneamente sia il catalogo che le mini-card di trasmissione.
       */
      function salvaModificheImmobileUI() {
        var selModal = document.getElementById('mod-immobile-select');
        var tabName = selModal ? selModal.value : '';
        if (!tabName) {
          alert("Seleziona prima un immobile da modificare.");
          return;
        }

        var prezzoVal = document.getElementById('mod-immobile-prezzo') ? document.getElementById('mod-immobile-prezzo').value.trim() : '';
        var mqVal = document.getElementById('mod-immobile-mq') ? document.getElementById('mod-immobile-mq').value.trim() : '';
        var zonaVal = document.getElementById('mod-immobile-zona') ? document.getElementById('mod-immobile-zona').value.trim() : '';
        var testoFVal = document.getElementById('mod-immobile-testo-f') ? document.getElementById('mod-immobile-testo-f').value.trim() : '';

        var btnSalva = document.getElementById('btn-salva-mod-immobile');
        var statusEl = document.getElementById('mod-immobile-status');

        if (statusEl) {
          statusEl.style.display = 'block';
          statusEl.style.background = 'rgba(243, 156, 18, 0.2)';
          statusEl.style.color = '#f1c40f';
          statusEl.style.border = '1px solid #f39c12';
          statusEl.innerHTML = '⏳ Salvataggio in corso su Google Sheets e aggiornamento catalogo live...';
        }
        if (btnSalva) btnSalva.disabled = true;

        var payload = {
          tabName: tabName,
          sheet: tabName,
          prezzo: prezzoVal,
          mq: mqVal,
          zona: zonaVal,
          testoColonnaF: testoFVal
        };

        function gestisciSuccesso(res) {
          if (btnSalva) btnSalva.disabled = false;
          if (res && res.success) {
            if (statusEl) {
              statusEl.style.display = 'block';
              statusEl.style.background = 'rgba(39, 174, 96, 0.25)';
              statusEl.style.color = '#2ecc71';
              statusEl.style.border = '1.5px solid #27ae60';
              statusEl.innerHTML = '✅ <b>Dati salvati con successo!</b><br>' +
                'Google Sheets aggiornato per ' + (res.rowsUpdated || 'tutte le') + ' righe dell\'immobile.<br>' +
                '<small>💰 Prezzo: ' + (res.prezzo || prezzoVal) + ' | 📐 Superficie: ' + (res.mq || mqVal) + '</small><br>' +
                '<small style="color:var(--gold);">— Immobiliare Giancani</small>';
            }

            // Aggiorna cache locale in memoria _immobiliFullDataMap
            if (_immobiliFullDataMap && _immobiliFullDataMap[tabName]) {
              if (res.prezzo) _immobiliFullDataMap[tabName].prezzo = res.prezzo;
              if (res.mq) _immobiliFullDataMap[tabName].mq = res.mq;
              if (res.zona) _immobiliFullDataMap[tabName].zona = res.zona;
              if (res.testoColonnaF) _immobiliFullDataMap[tabName].testoColonnaF = res.testoColonnaF;
            }

            // Aggiorna i campi di input con i valori normalizzati
            if (res.prezzo && document.getElementById('mod-immobile-prezzo')) {
              document.getElementById('mod-immobile-prezzo').value = (res.prezzoRaw || res.prezzo).toString().replace(/[^\d]/g, '');
            }
            if (res.mq && document.getElementById('mod-immobile-mq')) {
              document.getElementById('mod-immobile-mq').value = res.mq;
            }
            if (res.testoColonnaF && document.getElementById('mod-immobile-testo-f')) {
              document.getElementById('mod-immobile-testo-f').value = res.testoColonnaF;
            }

            // Aggiorna mini-card visive di trasmissione live e master
            if (typeof aggiornaMiniCardImmobile === 'function') {
              aggiornaMiniCardImmobile(tabName, 'live');
              aggiornaMiniCardImmobile(tabName, 'master');
            }
          } else {
            if (statusEl) {
              statusEl.style.display = 'block';
              statusEl.style.background = 'rgba(231, 76, 60, 0.2)';
              statusEl.style.color = '#e74c3c';
              statusEl.style.border = '1px solid #c0392b';
              statusEl.innerHTML = '❌ <b>Errore nel salvataggio:</b> ' + (res ? res.error : 'Errore sconosciuto');
            }
          }
        }

        function gestisciErrore(err) {
          if (btnSalva) btnSalva.disabled = false;
          if (statusEl) {
            statusEl.style.display = 'block';
            statusEl.style.background = 'rgba(231, 76, 60, 0.2)';
            statusEl.style.color = '#e74c3c';
            statusEl.style.border = '1px solid #c0392b';
            statusEl.innerHTML = '❌ <b>Errore di connessione:</b> ' + err;
          }
        }

        // Chiamata via Google Apps Script se disponibile
        if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.salvaModificheSchedaImmobile === 'function') {
          google.script.run
            .withSuccessHandler(gestisciSuccesso)
            .withFailureHandler(gestisciErrore)
            .salvaModificheSchedaImmobile(tabName, payload);
        } else {
          // Fallback Web App Bridge HTTP (per esecuzione in browser standalone o proxy)
          var webAppUrl = 'https://script.google.com/macros/s/AKfycbwTAyOTWpm3mNGX-DAWbZ7XOtrog52md5-P_jUEHoEhsoXCrJGj_bLClOiDvo5FKUbpWg/exec';
          var fetchUrl = webAppUrl + '?action=salva_dati_immobile' +
            '&sheet=' + encodeURIComponent(tabName) +
            '&prezzo=' + encodeURIComponent(prezzoVal) +
            '&mq=' + encodeURIComponent(mqVal) +
            '&zona=' + encodeURIComponent(zonaVal) +
            '&testoColonnaF=' + encodeURIComponent(testoFVal);

          fetch(fetchUrl)
            .then(function(r) { return r.json(); })
            .then(gestisciSuccesso)
            .catch(gestisciErrore);
        }
      }
