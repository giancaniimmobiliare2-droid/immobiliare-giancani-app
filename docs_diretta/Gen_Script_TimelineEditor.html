/**
 * ⏱️ Ricalcola la durata totale sommando tutte le clip
 */
function ricalcolaDurataTotaleTimeline() {
  var tot = 0.0;
  for (var i = 0; i < _timelineState.clips.length; i++) {
    tot += parseFloat(_timelineState.clips[i].durata) || 3.0;
  }
  _timelineState.durataTotale = Math.max(1.0, parseFloat(tot.toFixed(2)));

  var badge = document.getElementById('timeline-total-dur-badge');
  if (badge) badge.innerText = 'DURATA TOTALE: ' + _timelineState.durataTotale.toFixed(1) + 's';

  rigeneraRulerTimelineUI();
}

/**
 * 📏 Rigenera la scala temporale (Ruler) in proporzione alla durata totale
 */
function rigeneraRulerTimelineUI() {
  var ruler = document.getElementById('timeline-ruler-container');
  if (!ruler) return;

  var tot = _timelineState.durataTotale;
  var step = tot <= 10 ? 1 : (tot <= 25 ? 2 : 5);
  var html = '';

  for (var s = 0; s <= tot; s += step) {
    var min = Math.floor(s / 60);
    var sec = s % 60;
    var timeStr = (min < 10 ? '0' : '') + min + ':' + (sec < 10 ? '0' : '') + sec;
    html += '<div class="timeline-ruler-tick">' + timeStr + '</div>';
  }
  ruler.innerHTML = html;
}

/**
 * 🎛️ Seleziona il Tab Attivo nell'Editor degli Oggetti
 */
function selezionaTabEditorOggetti(tabName) {
  _timelineState.activeObjTab = tabName;

  // Aggiorna pulsanti tab
  var btns = document.querySelectorAll('.obj-editor-tabs-nav .obj-tab-btn');
  btns.forEach(function(b) { b.classList.remove('active'); });
  var activeBtn = document.getElementById('obj-tab-btn-' + tabName);
  if (activeBtn) activeBtn.classList.add('active');

  // Mostra pannello corrispondente
  var panels = document.querySelectorAll('.obj-editor-panel');
  panels.forEach(function(p) { p.classList.remove('active'); });
  var activePanel = document.getElementById('obj-panel-' + tabName);
  if (activePanel) activePanel.classList.add('active');

  // Aggiorna badge stato
  var badge = document.getElementById('badge-obj-active');
  if (badge) {
    if (tabName === 'clip') badge.innerText = 'CLIP #' + (_timelineState.activeClipIdx + 1) + ' ATTIVA';
    else if (tabName === 'testo') badge.innerText = 'TYPOGRAPHY & TESTI';
    else if (tabName === 'trans') badge.innerText = 'TRANSIZIONI & FLASH';
    else if (tabName === 'audio') badge.innerText = 'AUDIO & SOUND DESIGN';
    else if (tabName === 'add') badge.innerText = 'INSERIMENTO OGGETTI';
  }

  if (tabName === 'trans') {
    popolaListaDettagliataTransizioniUI();
  }
}

/**
 * 📥 Carica i dati di una specifica clip nel form dell'Inspector
 */
function caricaClipInEditor(clipIdx) {
  if (clipIdx < 0 || clipIdx >= _timelineState.clips.length) clipIdx = 0;
  _timelineState.activeClipIdx = clipIdx;
  var clip = _timelineState.clips[clipIdx];

  // Popola Dropdown Selettore Clip
  var sel = document.getElementById('obj-clip-select');
  if (sel) {
    sel.innerHTML = '';
    _timelineState.clips.forEach(function(c, i) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.text = 'Scena ' + (i + 1) + ': ' + (c.titolo || 'Clip') + ' (' + c.durata.toFixed(1) + 's)';
      if (i === clipIdx) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  var idxBadge = document.getElementById('obj-clip-idx-badge');
  if (idxBadge) idxBadge.innerText = '#' + (clipIdx + 1) + ' di ' + _timelineState.clips.length;

  // Campi Tab Clip
  var titoloInput = document.getElementById('obj-clip-titolo');
  if (titoloInput) titoloInput.value = clip.titolo || '';

  var imgInput = document.getElementById('obj-clip-img');
  if (imgInput) imgInput.value = clip.img || '';

  var durRange = document.getElementById('obj-clip-dur-range');
  var durDisp = document.getElementById('obj-clip-dur-display');
  if (durRange) durRange.value = clip.durata;
  if (durDisp) durDisp.innerText = clip.durata.toFixed(1) + 's';

  var fxSel = document.getElementById('obj-clip-fx');
  if (fxSel) fxSel.value = clip.fx || 'ken_burns_zoom_in';

  var transSel = document.getElementById('obj-clip-trans');
  if (transSel) transSel.value = clip.transizioneUscita || 'flash';

  // Campi Tab Testo
  var emInput = document.getElementById('obj-text-emoji');
  if (emInput) emInput.value = clip.emoji || '🌿';

  var calloutInput = document.getElementById('obj-text-callout');
  if (calloutInput) calloutInput.value = clip.callout || '';

  var subTextarea = document.getElementById('obj-text-sub');
  if (subTextarea) subTextarea.value = clip.sub || '';

  evidenziaClipAttiva(clipIdx);
  aggiornaMonitorScenaUI(clipIdx, false);
}

/**
 * 📋 Duplica Clip Attiva
 */
function duplicaClipTimeline() {
  var cur = _timelineState.clips[_timelineState.activeClipIdx];
  if (!cur) return;

  var clone = JSON.parse(JSON.stringify(cur));
  clone.id = _timelineState.clips.length;
  clone.titolo = (_timelineState.clips.length + 1) + ". 📋 Copia di " + cur.titolo.replace(/^\d+\.\s*/, '');

  _timelineState.clips.push(clone);
  ricalcolaDurataTotaleTimeline();
  rigeneraLanesTimelineUI();
  selezionaClipTimeline(clone.id);
}

/**
 * 🗑️ Elimina Clip Attiva
 */
function eliminaClipAttivaTimeline() {
  if (_timelineState.clips.length <= 1) {
    alert("⚠️ La timeline deve contenere almeno 1 clip video.");
    return;
  }
  if (confirm("Vuoi davvero eliminare la Scena #" + (_timelineState.activeClipIdx + 1) + "?")) {
    _timelineState.clips.splice(_timelineState.activeClipIdx, 1);
    // Re-indicizza
    _timelineState.clips.forEach(function(c, i) { c.id = i; });
    ricalcolaDurataTotaleTimeline();
    rigeneraLanesTimelineUI();
    var nextIdx = Math.max(0, _timelineState.activeClipIdx - 1);
    selezionaClipTimeline(nextIdx);
  }
}

function eliminaUltimaClipTimeline() {
  if (_timelineState.clips.length <= 1) {
    alert("⚠️ La timeline deve contenere almeno 1 clip video.");
    return;
  }
  _timelineState.clips.pop();
  ricalcolaDurataTotaleTimeline();
  rigeneraLanesTimelineUI();
  selezionaClipTimeline(_timelineState.clips.length - 1);
}

/**
 * ⚡ Gestione Transizioni
 */
function impostaTransizioneMaster(tipo) {
  _timelineState.transizioneMaster = tipo;

  var btns = document.querySelectorAll('.timeline-trans-selector-grid .btn-trans-choice');
  btns.forEach(function(b) { b.classList.remove('active'); });
  var activeBtn = document.getElementById('btn-trans-' + tipo);
  if (activeBtn) activeBtn.classList.add('active');

  for (var i = 0; i < _timelineState.clips.length; i++) {
    if (tipo === 'mix') {
      var seq = ['flash', 'glow', 'sfumatura'];
      _timelineState.clips[i].transizioneUscita = seq[i % seq.length];
    } else {
      _timelineState.clips[i].transizioneUscita = tipo;
    }
  }

  rigeneraLanesTimelineUI();
  popolaListaDettagliataTransizioniUI();
}

function ciclaTutteLeTransizioni() {
  var seq = ['mix', 'flash', 'sfumatura', 'glow', 'cut'];
  var curIdx = seq.indexOf(_timelineState.transizioneMaster);
  var next = seq[(curIdx + 1) % seq.length];
  impostaTransizioneMaster(next);
}

function ciclaTransizionePill(clipIdx) {
  var clip = _timelineState.clips[clipIdx];
  if (!clip) return;

  var seq = ['flash', 'glow', 'sfumatura', 'cut'];
  var curIdx = seq.indexOf(clip.transizioneUscita);
  clip.transizioneUscita = seq[(curIdx + 1) % seq.length];

  rigeneraLanesTimelineUI();
  popolaListaDettagliataTransizioniUI();
  aggiornaMonitorScenaUI(clipIdx, true);
}

function popolaListaDettagliataTransizioniUI() {
  var container = document.getElementById('obj-trans-list-container');
  if (!container) return;

  var html = '';
  for (var i = 0; i < _timelineState.clips.length - 1; i++) {
    var c1 = _timelineState.clips[i];
    var c2 = _timelineState.clips[i + 1];
    var tType = c1.transizioneUscita || 'flash';

    html += '<div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.03); border:1px solid rgba(201,163,94,0.25); border-radius:8px; padding:8px 12px; gap:10px;">';
    html += '  <span style="font-size:11px; font-weight:700; color:#cbd5e1;">Stacco ' + (i + 1) + ': Scena ' + (i + 1) + ' ➔ Scena ' + (i + 2) + '</span>';
    html += '  <select onchange="onCambiaSingolaTransizione(' + i + ', this.value)" class="obj-select" style="max-width:180px; padding:4px 8px; font-size:11px;">';
    html += '    <option value="flash"' + (tType === 'flash' ? ' selected' : '') + '>⚡ Flash Bianco</option>';
    html += '    <option value="glow"' + (tType === 'glow' ? ' selected' : '') + '>✨ Glow Dorato</option>';
    html += '    <option value="sfumatura"' + (tType === 'sfumatura' ? ' selected' : '') + '>🌫️ Sfumatura</option>';
    html += '    <option value="cut"' + (tType === 'cut' ? ' selected' : '') + '>✂️ Taglio Netto</option>';
    html += '  </select>';
    html += '</div>';
  }
  container.innerHTML = html;
}

    _timelineState.clips[clipIdx].transizioneUscita = val;

/**
 * 🎞️ Rigenera le tracce orizzontali della Timeline in base allo stato attuale
 */
function rigeneraLanesTimelineUI() {
  var laneClips = document.getElementById('lane-video-clips');
  var laneSubs = document.getElementById('lane-text-subtitles');
  var laneAudio = document.getElementById('lane-audio-music');

  if (!laneClips || !laneSubs) return;

  var totDur = _timelineState.durataTotale;
  var clipsHtml = '';
  var subsHtml = '';
  var tAccum = 0.0;

  for (var i = 0; i < _timelineState.clips.length; i++) {
    var c = _timelineState.clips[i];
    var tStart = tAccum;
    var tEnd = tAccum + c.durata;
    tAccum = tEnd;

    var isActive = (i === _timelineState.activeClipIdx);
    var tType = c.transizioneUscita || 'flash';

    // Clip Block
    clipsHtml += '<div class="timeline-clip-block' + (isActive ? ' active' : '') + '" id="tl-clip-' + i + '" onclick="selezionaClipTimeline(' + i + ')" style="flex:' + c.durata.toFixed(1) + ';" title="Tocca per modificare la Scena #' + (i + 1) + '">';
    clipsHtml += '  <span>' + (c.titolo || ('Scena ' + (i + 1))) + '</span>';
    clipsHtml += '  <span class="clip-dur">' + tStart.toFixed(1) + 's - ' + tEnd.toFixed(1) + 's (' + c.durata.toFixed(1) + 's)</span>';
    clipsHtml += '</div>';

    // Transition Pill tra le clip
    if (i < _timelineState.clips.length - 1) {
      var pillLabel = (tType === 'flash' ? '⚡ Flash' : (tType === 'glow' ? '✨ Glow' : (tType === 'sfumatura' ? '🌫️ Sfumatura' : '✂️ Taglio')));
      clipsHtml += '<span class="timeline-trans-pill trans-' + tType + '" id="trans-pill-' + i + '" onclick="ciclaTransizionePill(' + i + ')" title="Tocca per cambiare transizione">' + pillLabel + '</span>';
    }

    // Subtitle Block
    subsHtml += '<div class="timeline-sub-block' + (isActive ? ' active' : '') + '" style="flex:' + c.durata.toFixed(1) + ';" onclick="selezionaClipTimeline(' + i + '); selezionaTabEditorOggetti(\'testo\');" title="Tocca per modificare il testo">';
    subsHtml += '  ' + (c.emoji || '🌿') + ' ' + (c.callout || c.sub || 'Testo scena');
    subsHtml += '</div>';
  }

  laneClips.innerHTML = clipsHtml;
  laneSubs.innerHTML = subsHtml;

  // Traccia Audio
  if (laneAudio) {
    laneAudio.innerHTML = '<div class="timeline-audio-block" onclick="selezionaTabEditorOggetti(\'audio\')" title="Tocca per modificare le impostazioni audio">' +
      '<span>🥁 ' + (_timelineState.audio.nome || 'Beat Ritmico 124 BPM') + ' • Volume: ' + _timelineState.audio.volume + '%</span>' +
      '<span style="font-size:9.5px; background:rgba(34,197,94,0.3); padding:2px 6px; border-radius:4px; font-weight:800;">' + (_timelineState.audio.ducking ? 'DUCKING ATTIVO (-14dB)' : 'DUCKING DISATTIVO') + '</span>' +
      '</div>';
  }
}

/**
 * 🎬 Seleziona manualmente una clip sulla timeline
 */
function selezionaClipTimeline(clipIdx) {
  if (clipIdx < 0 || clipIdx >= _timelineState.clips.length) return;
  _timelineState.activeClipIdx = clipIdx;

  var tStart = 0;
  for (var i = 0; i < clipIdx; i++) {
    tStart += _timelineState.clips[i].durata;
  }
  _timelineState.currentTime = tStart;

  aggiornaPosizioneAgo(tStart);
  caricaClipInEditor(clipIdx);
}

function evidenziaClipAttiva(clipIdx) {
  var blocks = document.querySelectorAll('#lane-video-clips .timeline-clip-block');
  blocks.forEach(function(b, i) {
    if (i === clipIdx) b.classList.add('active');
    else b.classList.remove('active');
  });
  var subBlocks = document.querySelectorAll('#lane-text-subtitles .timeline-sub-block');
  subBlocks.forEach(function(b, i) {
    if (i === clipIdx) b.classList.add('active');
    else b.classList.remove('active');
  });
}

/**
 * 📺 Aggiorna il monitor 9:16 con la scena attiva
 */
function aggiornaMonitorScenaUI(clipIdx, triggerTransition) {
  var clip = _timelineState.clips[clipIdx];
  if (!clip) return;

  var imgEl = document.getElementById('timeline-monitor-img');
  var calloutEl = document.getElementById('timeline-monitor-callout-txt');
  var subEl = document.getElementById('timeline-monitor-sub-txt');

  if (triggerTransition) {
    var flashEl = document.getElementById('timeline-monitor-flash');
    var transType = (clipIdx > 0) ? _timelineState.clips[clipIdx - 1].transizioneUscita : (clip.transizioneUscita || 'flash');

    if (flashEl) {
      if (transType === 'flash') {
        flashEl.style.background = '#ffffff';
        flashEl.style.opacity = '0.9';
        setTimeout(function() { flashEl.style.opacity = '0'; }, 120);
      } else if (transType === 'glow') {
        flashEl.style.background = '#ffd700';
        flashEl.style.opacity = '0.75';
        setTimeout(function() { flashEl.style.opacity = '0'; }, 180);
      } else if (transType === 'sfumatura') {
        flashEl.style.background = '#000000';
        flashEl.style.opacity = '0.85';
        setTimeout(function() { flashEl.style.opacity = '0'; }, 220);
      }
    }
  }

  if (imgEl) {
    imgEl.src = clip.img;
    imgEl.className = 'timeline-monitor-bg';
    if (clip.fx === 'ken_burns_zoom_in') imgEl.classList.add('fx-zoom');
    else if (clip.fx === 'ken_burns_pan_right') imgEl.classList.add('fx-pan');
  }

  if (calloutEl) {
    calloutEl.innerHTML = (clip.emoji || '🌿') + ' ' + (clip.callout || 'IMMOBILE DI PREGIO');
  }

  if (subEl) {
    var brandBadge = '<div style="display:inline-block; margin-top:8px; background:rgba(10,8,6,0.95); border:2px solid #ffd700; border-radius:14px; padding:4px 14px; box-shadow:0 0 14px rgba(255,215,0,0.45);"><span style="font-family:\'Anton\',\'Impact\',sans-serif; font-size:13.5px; font-weight:900; letter-spacing:1px; color:#ffe666;">— IMMOBILIARE GIANCANI</span></div>';
    subEl.innerHTML = (clip.emoji || '✨') + ' <strong>' + (clip.titolo ? clip.titolo.replace(/^\d+\.\s*/, '') : 'Scena') + '</strong><br>' +
      '<span style="font-size:11px; font-weight:600; color:#e2e8f0;">' + (clip.sub || '') + '</span><br>' + brandBadge;
  }
}

/**
 * ▶️ Riproduzione / Pausa Anteprima Timeline
 */
function togglePlayTimeline() {
  if (_timelineState.isPlaying) {
    pausaTimeline();
  } else {
    avviaTimelinePlay();
  }
}

function avviaTimelinePlay() {
  _timelineState.isPlaying = true;
  var playBtn = document.getElementById('btn-timeline-play');
  var playIcon = document.getElementById('timeline-play-icon');
  var playLabel = document.getElementById('timeline-play-label');
  if (playIcon) playIcon.innerText = '⏸️';
  if (playLabel) playLabel.innerText = 'METTI IN PAUSA';
  if (playBtn) playBtn.style.background = 'linear-gradient(135deg, #e74c3c, #c0392b)';

  var lastClipIdx = determinaClipDaTempo(_timelineState.currentTime);

  clearInterval(_timelineState.timerInterval);
  _timelineState.timerInterval = setInterval(function() {
    _timelineState.currentTime += 0.1;
    if (_timelineState.currentTime >= _timelineState.durataTotale) {
      _timelineState.currentTime = 0.0;
    }

    aggiornaPosizioneAgo(_timelineState.currentTime);

    var curClipIdx = determinaClipDaTempo(_timelineState.currentTime);
    if (curClipIdx !== lastClipIdx) {
      aggiornaMonitorScenaUI(curClipIdx, true);
      evidenziaClipAttiva(curClipIdx);
      lastClipIdx = curClipIdx;
    }

    var tStartClip = 0;
    for (var k = 0; k < curClipIdx; k++) {
      tStartClip += _timelineState.clips[k].durata;
    }
    var tRelClip = _timelineState.currentTime - tStartClip;
    aggiornaSottotitoloDinamicoMonitor(curClipIdx, tRelClip);

    var tc = document.getElementById('timeline-monitor-tc');
    if (tc) {
      var s = _timelineState.currentTime.toFixed(2);
      tc.innerText = (s < 10 ? '00:0' : '00:') + s + ' / ' + _timelineState.durataTotale.toFixed(2);
    }
  }, 100);
}

function pausaTimeline() {
  _timelineState.isPlaying = false;
  clearInterval(_timelineState.timerInterval);
  var playBtn = document.getElementById('btn-timeline-play');
  var playIcon = document.getElementById('timeline-play-icon');
  var playLabel = document.getElementById('timeline-play-label');
  if (playIcon) playIcon.innerText = '▶️';
  if (playLabel) playLabel.innerText = 'AVVIA ANTEPRIMA';
  if (playBtn) playBtn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
}

function resetTimelineToStart() {
  pausaTimeline();
  _timelineState.currentTime = 0.0;
  aggiornaPosizioneAgo(0.0);
  aggiornaMonitorScenaUI(0, false);
  evidenziaClipAttiva(0);
  var tc = document.getElementById('timeline-monitor-tc');
  if (tc) tc.innerText = '00:00.00 / ' + _timelineState.durataTotale.toFixed(2);
}

function determinaClipDaTempo(t) {
  var accum = 0.0;
  for (var i = 0; i < _timelineState.clips.length; i++) {
    accum += _timelineState.clips[i].durata;
    if (t < accum) return i;
  }
  return _timelineState.clips.length - 1;
}

function aggiornaPosizioneAgo(t) {
  var needle = document.getElementById('timeline-playhead-needle');
  var lane = document.getElementById('lane-video-clips');
  if (!needle || !lane) return;

  var pct = t / _timelineState.durataTotale;
  var laneWidth = lane.clientWidth || 760;
  var leftPos = 140 + (pct * laneWidth);
  needle.style.left = leftPos + 'px';
}

/**
 * 🔤 Imposta font tipografico
 */
function impostaFontTipografico(fontName) {
  _timelineState.fontScelto = fontName;

  var btns = document.querySelectorAll('.timeline-font-grid .btn-font-choice');
  btns.forEach(function(b) { b.classList.remove('active'); });
  var activeBtn = document.getElementById('btn-font-' + fontName);
  if (activeBtn) activeBtn.classList.add('active');

  var subEl = document.getElementById('timeline-monitor-sub-txt');
  if (subEl) {
    subEl.className = subEl.className.replace(/\bmonitor-font-\S+/g, '');
    subEl.classList.add('monitor-font-' + fontName);
  }
}

/**
 * ✨ Imposta effetto animazione testo (Retro & Glow)
 */
function impostaEffettoTesto(effName) {
  _timelineState.effettoTesto = effName;

  var btns = document.querySelectorAll('.timeline-effect-grid .btn-effect-choice');
  btns.forEach(function(b) { b.classList.remove('active'); });
  var activeBtn = document.getElementById('btn-eff-' + effName);
  if (activeBtn) activeBtn.classList.add('active');

  var subEl = document.getElementById('timeline-monitor-sub-txt');
  if (subEl) {
    subEl.className = subEl.className.replace(/\beffect-\S+/g, '');
    subEl.classList.add('effect-' + effName);
  }
}

/**
 * 🎤 Karaoke parola per parola
 */
function aggiornaSottotitoloDinamicoMonitor(clipIdx, tRelativoInClip) {
  var clip = _timelineState.clips[clipIdx];
  if (!clip || !clip.parole || clip.parole.length === 0) return;

  var subEl = document.getElementById('timeline-monitor-sub-txt');
  if (!subEl) return;

  var dur = clip.durata;
  var pct = Math.max(0, Math.min(1, tRelativoInClip / dur));
  var activeWIdx = Math.min(clip.parole.length - 1, Math.floor(pct * clip.parole.length));

  var paroleHtml = clip.parole.map(function(w, i) {
    if (i === activeWIdx) {
      return '<span class="karaoke-pop">' + w + '</span>';
    }
    return w;
  }).join(' ');

  var brandBadge = '<div style="display:inline-block; margin-top:8px; background:rgba(10,8,6,0.95); border:2px solid #ffd700; border-radius:14px; padding:4px 14px; box-shadow:0 0 14px rgba(255,215,0,0.45);"><span style="font-family:\'Anton\',\'Impact\',sans-serif; font-size:13.5px; font-weight:900; letter-spacing:1px; color:#ffe666;">— IMMOBILIARE GIANCANI</span></div>';

  subEl.innerHTML = (clip.emoji || '✨') + ' ' + paroleHtml + '<br>' + brandBadge;
}

/**
 * 🎬 Esegui Rendering Spot con la configurazione personalizzata degli Oggetti
 */
function eseguiRenderingSpotRitmicoDaTimeline() {
  var statusEl = document.getElementById('timeline-render-status');
  if (statusEl) {
    statusEl.style.display = 'block';
    statusEl.innerHTML = '⏳ <strong>Elaborazione Video con FFmpeg...</strong><br>' +
      'Scene: ' + _timelineState.clips.length + ' • Durata Totale: ' + _timelineState.durataTotale.toFixed(1) + 's • Transizioni: ' + _timelineState.transizioneMaster.toUpperCase() + ' • Font: ' + _timelineState.fontScelto.toUpperCase();
  }

  var payload = {
    action: "render_timeline_spot",
    durataTotale: _timelineState.durataTotale,
    transizioneMaster: _timelineState.transizioneMaster,
    fontScelto: _timelineState.fontScelto,
    effettoTesto: _timelineState.effettoTesto,
    audio: _timelineState.audio,
    clips: _timelineState.clips
  };

  alert("🎬 Rendering Video Spot Ritmico 9:16 Avviato!\n" +
    "• Numero Scene Personalizzate: " + _timelineState.clips.length + "\n" +
    "• Durata Totale Calibrata: " + _timelineState.durataTotale.toFixed(1) + "s\n" +
    "• Transizioni: " + _timelineState.transizioneMaster.toUpperCase() + "\n" +
    "• Tipografia: " + _timelineState.fontScelto.toUpperCase() + "\n" +
    "• Audio: " + _timelineState.audio.nome + "\n\n" +
    "Il video verrà generato dal motore grafico e inviato su Telegram Staff (1723292483)!\n\n— Immobiliare Giancani");

  setTimeout(function() {
    if (statusEl) {
      statusEl.innerHTML = '✅ <strong>Spot Video Renderizzato con Successo!</strong> Inviato direttamente alla chat Telegram Staff (1723292483). — Immobiliare Giancani';
    }
  }, 2200);
}

function apriScegliMediaDaGalleria() {
  if (typeof mostraTab === 'function') {
    if (confirm("Vuoi aprire la Galleria Immobili per copiare il link di una foto o video?")) {
      mostraTab('tab-galleria');
    }
  }
}

</script>
