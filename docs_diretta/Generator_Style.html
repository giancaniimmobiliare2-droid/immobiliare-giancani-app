    <style>
      :root {
        --bg-dark: #090705;
        --card-bg: rgba(18, 14, 11, 0.94);
        --card-surface: rgba(255, 255, 255, 0.035);
        --card-hover: rgba(255, 255, 255, 0.055);
        --gold: #c9a35e;
        --gold-bright: #f5d485;
        --gold-dark: #8c6e33;
        --gold-glow: rgba(201, 163, 94, 0.35);
        --terracotta: #a6512d;
        --sand: #d9c5ab;
        --ivory: #fcf9f2;
        --line: rgba(201, 163, 94, 0.25);
        --line-soft: rgba(255, 255, 255, 0.08);
        --line-active: rgba(201, 163, 94, 0.6);
        --radius-xl: 24px;
        --radius-lg: 18px;
        --radius-md: 12px;
        --radius-sm: 8px;
        --radius-pill: 999px;
        --touch-target: 44px;
        --shadow-elevation-1: 0 4px 20px rgba(0, 0, 0, 0.6);
        --shadow-elevation-2: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px var(--gold-glow);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

      body {
        background-color: var(--bg-dark);
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(166, 81, 45, 0.25), transparent 70%),
          radial-gradient(circle at 100% 100%, rgba(201, 163, 94, 0.18), transparent 60%),
          radial-gradient(circle at 0% 50%, rgba(24, 119, 242, 0.06), transparent 50%);
        background-attachment: fixed;
        color: var(--ivory);
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 8px;
      }

      @media (min-width: 768px) { body { padding: 24px 16px; } }

      .container {
        width: 100%; max-width: 1360px; background: var(--card-bg);
        border: 1px solid var(--line); border-radius: var(--radius-xl);
        padding: 16px; box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      }
      @media (min-width: 768px) { .container { padding: 26px 28px; } }

      /* HEADER MODERNO */
      .header {
        text-align: center; border-bottom: 1px solid var(--line-soft);
        padding-bottom: 18px; margin-bottom: 20px; position: relative;
      }
      .logo-img { height: 52px; margin-bottom: 8px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6)); }
      @media (min-width: 768px) { .logo-img { height: 64px; } }

      .title {
        font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; color: var(--gold-bright);
        display: flex; align-items: center; justify-content: center; gap: 10px; line-height: 1.3;
        letter-spacing: -0.01em;
      }
      @media (min-width: 768px) { .title { font-size: 26px; } }
      .subtitle { font-size: 11.5px; color: var(--sand); margin-top: 6px; line-height: 1.5; opacity: 0.92; }

      /* GATE TELEFONO */
      #phone-auth-gate { text-align: center; padding: 40px 16px; max-width: 480px; margin: 0 auto; }
      .lock-icon { font-size: 56px; margin-bottom: 16px; display: inline-block; animation: pulseGlow 2.5s infinite; }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(201,163,94,0.4)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 25px rgba(245,212,133,0.8)); }
      }

      .auth-input {
        width: 100%; min-height: 48px; padding: 12px 18px; border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
        color: var(--ivory); font-size: 16px; font-weight: 700; text-align: center;
        letter-spacing: 0.14em; outline: none; margin-bottom: 16px; transition: all 0.2s ease;
      }
      .auth-input:focus { border-color: var(--gold-bright); background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 20px var(--gold-glow); }

      /* TAB NAVIGATION BAR (SCOMPARTIMENTI MACRO) */
      .tab-nav {
        display: flex; gap: 8px; background: rgba(0, 0, 0, 0.6);
        padding: 6px; border-radius: var(--radius-md); border: 1px solid var(--line-soft);
        margin-bottom: 22px; overflow-x: auto; scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
      }
      .tab-nav::-webkit-scrollbar { height: 4px; }
      .tab-nav::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 4px; }

      .tab-btn {
        flex: 0 0 auto; min-height: var(--touch-target); padding: 8px 16px;
        background: transparent; color: var(--sand); border: none; border-radius: var(--radius-sm);
        font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 7px;
        scroll-snap-align: start;
      }
      @media (min-width: 1100px) {
        .tab-nav { display: grid; grid-template-columns: repeat(4, 1fr); overflow-x: visible; gap: 8px; }
        .tab-btn { flex: 1; font-size: 11.5px; }
      }
      .tab-btn:hover { color: var(--gold-bright); background: rgba(255, 255, 255, 0.06); transform: translateY(-1px); }
      .tab-btn.active {
        background: linear-gradient(135deg, var(--gold), var(--gold-dark));
        color: #120c04; font-weight: 800;
        box-shadow: 0 4px 18px rgba(201, 163, 94, 0.45);
      }

      .tab-content { display: none; animation: tabFadeSlide 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
      .tab-content.active { display: block; }

      @keyframes tabFadeSlide {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* SCOMPARTIMENTI MODULARI (COMPARTMENT CARDS) */
      .section-card {
        background: var(--card-surface); border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg); padding: 18px; margin-bottom: 20px;
        position: relative; overflow: hidden;
        transition: border-color 0.2s, box-shadow 0.2s;
        box-shadow: var(--shadow-elevation-1);
      }
      .section-card:hover { border-color: rgba(201, 163, 94, 0.35); }
      @media (min-width: 768px) { .section-card { padding: 22px 24px; } }

      .tab-header-bar {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line-soft);
      }

      .section-title {
        font-size: 13px; font-weight: 800; color: var(--gold-bright);
        display: flex; align-items: center; gap: 8px; text-transform: uppercase;
        letter-spacing: 0.05em; line-height: 1.3;
      }

      .btn-tutorial-trigger {
        background: rgba(201, 163, 94, 0.12); color: var(--gold-bright);
        border: 1px solid var(--gold); border-radius: var(--radius-pill); padding: 6px 14px;
        font-size: 11px; font-weight: 800; cursor: pointer; transition: all 0.2s;
        display: inline-flex; align-items: center; gap: 6px; min-height: 34px;
      }
      .btn-tutorial-trigger:hover { background: var(--gold); color: #120c04; }

      .btn-help-mini {
        width: 22px; height: 22px; border-radius: 50%; background: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--line-soft); color: var(--sand); font-size: 11px;
        display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
        transition: all 0.15s; vertical-align: middle; margin-left: 4px;
      }
      .btn-help-mini:hover { background: var(--gold); color: #120c04; border-color: var(--gold); }

      .mini-tutorial-box {
        display: none; background: rgba(15, 12, 10, 0.98); border: 1px solid var(--gold);
        border-radius: var(--radius-md); padding: 14px 16px; margin: 12px 0 16px 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      }
      .mini-tutorial-box h4 { color: var(--gold-bright); font-size: 13px; margin-bottom: 8px; }
      .tut-serve { font-size: 11.5px; color: var(--ivory); margin-bottom: 8px; line-height: 1.4; }
      .tut-steps { font-size: 11.5px; color: var(--sand); line-height: 1.5; }
      .tut-steps ol { padding-left: 18px; margin-top: 4px; }
      .tut-steps li { margin-bottom: 4px; }
      .tut-close-btn {
        margin-top: 10px; font-size: 11px; font-weight: 700; color: var(--gold);
        cursor: pointer; display: inline-block;
      }

      /* FORM CONTROLS MODERNI */
      .form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
      @media (min-width: 640px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 1024px) { .form-grid.cols-3 { grid-template-columns: repeat(3, 1fr); } }
      @media (min-width: 1024px) { .form-grid.cols-2 { grid-template-columns: repeat(2, 1fr); } }
      
      .form-group { display: flex; flex-direction: column; gap: 6px; }
      .form-group.full { grid-column: 1 / -1; }

      label { font-size: 11px; font-weight: 700; color: var(--sand); text-transform: uppercase; letter-spacing: 0.04em; }

      input[type="text"], input[type="number"], input[type="password"], input[type="time"], input[type="datetime-local"], select, textarea {
        width: 100%; min-height: var(--touch-target); padding: 10px 14px; border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line-soft);
        color: var(--ivory); font-size: 13px; outline: none; font-family: 'Inter', sans-serif;
        transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      }
      input:focus, select:focus, textarea:focus {
        border-color: var(--gold); background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 12px rgba(201, 163, 94, 0.25);
      }

      /* BUTTONS CON TOUCH FEEDBACK */
      .btn-gold {
        width: 100%; min-height: var(--touch-target); padding: 11px 18px;
        background: linear-gradient(135deg, var(--gold), var(--gold-dark));
        color: #120c04; border: none; border-radius: var(--radius-md); font-size: 12px;
        font-weight: 800; cursor: pointer; transition: transform 0.12s ease, box-shadow 0.15s ease, filter 0.15s;
        box-shadow: 0 4px 16px rgba(201, 163, 94, 0.3);
        display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
      }
      .btn-gold:hover { filter: brightness(1.08); box-shadow: 0 6px 22px rgba(201, 163, 94, 0.45); }
      .btn-gold:active { transform: scale(0.98); }

      /* STATS & CHARTS */
      .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
      @media (min-width: 768px) { .stat-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; } }

      .stat-card {
        background: rgba(12, 9, 7, 0.85); border: 1px solid var(--line-soft);
        border-radius: var(--radius-md); padding: 16px 12px; text-align: center;
        display: flex; flex-direction: column; justify-content: center; gap: 4px;
        transition: transform 0.2s, border-color 0.2s;
      }
      .stat-card:hover { transform: translateY(-2px); border-color: var(--gold); }
      .stat-val { font-size: 24px; font-weight: 800; color: var(--gold-bright); }
      .stat-lbl { font-size: 10px; font-weight: 700; color: var(--sand); text-transform: uppercase; }

      .chart-box {
        background: rgba(12, 9, 7, 0.85); border: 1px solid var(--line-soft);
        border-radius: var(--radius-md); padding: 14px; margin-bottom: 16px; position: relative; height: 270px;
      }
      @media (min-width: 768px) { .chart-box { height: 320px; } }

      .charts-wrapper { display: grid; grid-template-columns: 1fr; gap: 16px; }
      @media (min-width: 1024px) { .charts-wrapper { grid-template-columns: 1fr 1fr; } }

      /* GALLERIA MEDIA SCOMPARTIMENTO */
      .gallery-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
      @media (min-width: 540px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 900px) { .gallery-grid { grid-template-columns: repeat(3, 1fr); } }
      @media (min-width: 1200px) { .gallery-grid { grid-template-columns: repeat(4, 1fr); } }

      .gallery-card {
        background: rgba(14, 10, 8, 0.92); border: 1px solid var(--line-soft);
        border-radius: var(--radius-md); overflow: hidden; display: flex; flex-direction: column;
        transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      }
      .gallery-card:hover { transform: translateY(-2px); border-color: rgba(201, 163, 94, 0.4); }
      .gallery-card.selected { border-color: var(--gold) !important; box-shadow: 0 0 0 2px var(--gold); }

      .gallery-media-container { position: relative; width: 100%; height: 180px; background: #000; overflow: hidden; }
      .gallery-card video, .gallery-card img.thumb { width: 100%; height: 100%; object-fit: cover; }
      .gallery-select-checkbox {
        width: 24px; height: 24px; accent-color: var(--gold); cursor: pointer;
        position: absolute; top: 10px; right: 10px; z-index: 10;
      }

      .gallery-card-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }

      .filter-pill {
        min-height: 36px; padding: 6px 16px; border-radius: var(--radius-pill); border: 1px solid var(--line);
        background: transparent; color: var(--sand); font-size: 11.5px; font-weight: 700;
        cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center;
      }
      .filter-pill.active, .filter-pill:hover { background: var(--gold); color: #120c04; border-color: var(--gold); }

      .card-controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
      .card-btn {
        min-height: 38px; padding: 4px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700;
        cursor: pointer; transition: all 0.2s; border: 1px solid; display: flex; align-items: center; justify-content: center;
      }
      .card-btn-play { background: rgba(46,204,113,0.18); color: #2ecc71; border-color: #2ecc71; }
      .card-btn-edit { background: rgba(52,152,219,0.18); color: #3498db; border-color: #3498db; }
      .card-btn-ai { background: rgba(155,89,182,0.18); color: #9b59b6; border-color: #9b59b6; }
      .card-btn-photo { background: rgba(230,126,34,0.18); color: #e67e22; border-color: #e67e22; }
      .card-btn-del { background: rgba(231,76,60,0.18); color: #e74c3c; border-color: #e74c3c; }

      .card-text-edit {
        width: 100%; padding: 8px; border-radius: var(--radius-sm);
        background: rgba(255,255,255,0.05); border: 1px solid var(--line-soft);
        color: var(--ivory); font-size: 11px; line-height: 1.4; resize: vertical; min-height: 60px;
      }

      .upload-box-card {
        background: linear-gradient(135deg, rgba(201, 163, 94, 0.12), rgba(166, 81, 45, 0.12));
        border: 2px dashed var(--gold); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 20px;
      }

      /* 🏷️ FINESTRELLE E CHIP INTELLIGENTI STANZE — IMMOBILIARE GIANCANI */
      .smart-stanze-container {
        margin: 4px 0 6px 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
      }
      .smart-stanze-scroll {
        display: flex;
        align-items: center;
        gap: 4px;
        overflow-x: auto;
        white-space: nowrap;
        padding: 3px 0 5px 0;
        scrollbar-width: thin;
        scrollbar-color: rgba(201, 163, 94, 0.4) transparent;
      }
      .smart-stanze-scroll::-webkit-scrollbar {
        height: 4px;
      }
      .smart-stanze-scroll::-webkit-scrollbar-thumb {
        background: rgba(201, 163, 94, 0.4);
        border-radius: 4px;
      }
      .smart-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(22, 16, 12, 0.88);
        border: 1px solid rgba(201, 163, 94, 0.32);
        border-radius: 12px;
        color: #e8e2d8;
        font-size: 10.5px;
        font-weight: 600;
        padding: 3px 8px;
        cursor: pointer;
        transition: all 0.16s ease-in-out;
        flex-shrink: 0;
        user-select: none;
      }
      .smart-chip:hover {
        background: rgba(201, 163, 94, 0.25);
        border-color: var(--gold);
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 2px 6px rgba(201, 163, 94, 0.25);
      }
      .smart-chip:active {
        background: var(--gold);
        color: #120c04;
        transform: scale(0.96);
      }
      .smart-chip-more {
        background: rgba(52, 152, 219, 0.15);
        border-color: rgba(52, 152, 219, 0.45);
        color: #5dade2;
      }
      .smart-chip-more:hover {
        background: rgba(52, 152, 219, 0.32);
        border-color: #3498db;
        color: #fff;
      }
      .smart-subdetails-bar {
        display: flex;
        align-items: center;
        gap: 4px;
        overflow-x: auto;
        white-space: nowrap;
        padding: 4px 6px;
        background: rgba(10, 26, 36, 0.85);
        border: 1px dashed rgba(46, 204, 113, 0.45);
        border-radius: 8px;
        animation: fadeInSmartSub 0.2s ease-out;
      }
      @keyframes fadeInSmartSub {
        from { opacity: 0; transform: translateY(-3px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .smart-subchip {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: rgba(46, 204, 113, 0.14);
        border: 1px solid rgba(46, 204, 113, 0.35);
        border-radius: 10px;
        color: #2ecc71;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 7px;
        cursor: pointer;
        transition: all 0.15s ease-in-out;
        flex-shrink: 0;
        user-select: none;
      }
      .smart-subchip:hover {
        background: rgba(46, 204, 113, 0.28);
        border-color: #2ecc71;
        color: #fff;
        transform: translateY(-1px);
      }
      .smart-subchip:active {
        background: #2ecc71;
        color: #0c1a11;
        transform: scale(0.96);
      }

      #galleria-bulk-bar {
        display: none; gap: 8px; padding: 12px 16px; background: rgba(20, 10, 8, 0.95);
        border: 1px solid rgba(231,76,60,0.4); border-radius: var(--radius-md);
        align-items: center; flex-wrap: wrap; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      }
      @media (max-width: 767px) { #galleria-bulk-bar { position: sticky; bottom: 12px; z-index: 100; backdrop-filter: blur(12px); } }

      /* BADGES & STATUS INDICATORS */
      .badge-chip {
        display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
        border-radius: var(--radius-pill); font-size: 10px; font-weight: 800; letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .badge-live { background: #e50914; color: #fff; box-shadow: 0 0 10px rgba(229, 9, 20, 0.6); }
      .badge-ready { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
      .badge-ai { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #a855f7; }

      /* 🎭 STILI PULSANTIERA REGIA AVATAR (DarIA & DarIO) */
      .avatar-control-bar {
        background: rgba(8, 12, 22, 0.9);
        border: 2px solid var(--gold);
        border-radius: 16px;
        padding: 14px 20px;
        margin: 12px 0 18px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .avatar-control-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar-control-icon {
        font-size: 28px;
        line-height: 1;
      }

      .avatar-control-title {
        font-size: 14px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .avatar-control-subtitle {
        font-size: 11.5px;
        color: #bcb3a4;
        margin-top: 2px;
      }

      .avatar-control-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      /* Badge di Stato Avatar */
      .badge-status-on {
        font-size: 12px;
        font-weight: 800;
        padding: 7px 14px;
        border-radius: 20px;
        background: #27ae60;
        color: #ffffff;
        box-shadow: 0 0 12px rgba(39, 174, 96, 0.5);
        transition: all 0.3s ease;
      }

      .badge-status-off {
        font-size: 12px;
        font-weight: 800;
        padding: 7px 14px;
        border-radius: 20px;
        background: #e67e22;
        color: #ffffff;
        box-shadow: 0 0 12px rgba(230, 126, 34, 0.5);
        transition: all 0.3s ease;
      }

      /* Pulsante Attiva Avatar */
      .btn-avatar-on {
        background: linear-gradient(135deg, #27ae60, #2ecc71);
        color: #ffffff;
        font-weight: 800;
        border: none;
        border-radius: 10px;
        padding: 9px 18px;
        font-size: 12.5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        transition: transform 0.15s ease, opacity 0.2s ease;
      }

      .btn-avatar-on:hover {
        transform: scale(1.03);
        box-shadow: 0 0 16px rgba(46, 204, 113, 0.6);
      }

      /* Pulsante Disattiva Avatar */
      .btn-avatar-off {
        background: linear-gradient(135deg, #e74c3c, #c0392b);
        color: #ffffff;
        font-weight: 800;
        border: none;
        border-radius: 10px;
        padding: 9px 18px;
        font-size: 12.5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
        opacity: 0.65;
        transition: transform 0.15s ease, opacity 0.2s ease;
      }

      .btn-avatar-off:hover {
        transform: scale(1.03);
        box-shadow: 0 0 16px rgba(231, 76, 60, 0.6);
        opacity: 1;
      }
    </style>
